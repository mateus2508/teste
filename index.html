<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks - Seu Organizador de Links</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
        body { background-color: var(--bg); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Containers de exibição */
        #login-container { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); }
        #painel-principal { display: none; padding: 20px 4% 140px 4%; flex: 1; }

        .hero-title { font-size: clamp(2.5rem, 8vw, 4rem); color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 5px; font-weight: 900; }
        .hero-desc { max-width: 700px; color: #ccc; font-size: 1.1rem; margin: 25px 0; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #444; }
        .user-badge img { width: 28px; border-radius: 50%; border: 1px solid var(--primary); }

        /* Categorias e Banners */
        .categoria-titulo { font-size: 1.2rem; margin: 40px 0 20px 0; border-left: 5px solid var(--primary); padding-left: 15px; text-transform: uppercase; font-weight: bold; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; justify-content: flex-start; }

        .card { 
            flex: 1 1 220px; max-width: 350px; height: 140px; 
            background-color: var(--card); background-size: cover; background-position: center; 
            border-radius: 8px; text-decoration: none; color: white; transition: 0.4s; 
            overflow: hidden; border: 2px solid #333; position: relative;
        }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }

        /* Texto com borda e fundo escurecido sólido */
        .card-info { 
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 100%);
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; text-align: center; padding: 15px; box-sizing: border-box;
            text-transform: uppercase; font-size: 1.1rem;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px rgba(0,0,0,0.8);
        }

        .btn-icon { color: white; text-decoration: none; font-size: 20px; background: none; border: none; cursor: pointer; }
        .footer { background: #000; padding: 30px 4%; border-top: 1px solid #333; color: #666; font-size: 13px; margin-top: auto; }
        .footer-links a { color: #888; text-decoration: none; margin-left: 20px; }
    </style>
</head>

        <div id="buttonDiv"></div>
    </div>

    <div id="painel-principal">

        <div id="categorias-container">
