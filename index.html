<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks Gestão</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px 4%; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #E50914; margin: 0; font-size: 26px; }
        .btn-cadastro { background: #E50914; color: white; text-decoration: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-cadastro:hover { background: #b20710; }
        .categoria-titulo { font-size: 1.1rem; margin: 30px 0 15px 0; border-left: 4px solid #E50914; padding-left: 10px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; min-height: 50px; }
        .card { flex: 0 1 calc(20% - 15px); min-width: 190px; height: 115px; background-color: #2f2f2f; background-size: cover; background-position: center; border-radius: 6px; text-decoration: none; color: white; position: relative; border: 2px solid transparent; transition: transform 0.3s; overflow: hidden; }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 10; }
        .card-info { background: rgba(0,0,0,0.6); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; padding: 10px; box-sizing: border-box; font-size: 14px; }
        #loading { text-align: center; color: #E50914; padding: 30px; font-weight: bold; }
        @media (max-width: 768px) { .card { flex: 1 1 calc(45% - 15px); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>NetLinks Gestão</h1>
        <a href="cadastro.html" class="btn-cadastro">+ CADASTRAR NOVO</a>
    </div>

    <div id="loading">Sincronizando com a planilha...</div>

    <div class="categoria-titulo">SISTEMAS</div>
    <div class="fileira" id="container-sistemas"></div>

    <div class="categoria-titulo">CITR</div>
    <div class="fileira" id="container-citr"></div>

    <div class="categoria-titulo">CISL</div>
    <div class="fileira" id="container-cisl"></div>

    <div class="categoria-titulo">PAGAMENTOS</div>
    <div class="fileira" id="container-pagamentos"></div>

    <div class="categoria-titulo">MATERIAIS</div>
    <div class="fileira" id="container-materiais"></div>

    <div class="categoria-titulo">GESTÃO DE EQUIPE</div>
    <div class="fileira" id="container-gestao"></div>

    <script>
        async function carregarBanners() {
            const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
            
            try {
                const resposta = await fetch(urlApp);
                const dados = await resposta.json();
                
                document.getElementById('loading').style.display = 'none';

                dados.forEach(item => {
                    // Limpa o nome da categoria para o ID do container
                    let catFix = item.categoria.toLowerCase()
                                 .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                                 .replace("gestao de equipe", "gestao")
                                 .trim();

                    const container = document.getElementById(`container-${catFix}`);
                    
                    if (container) {
                        container.innerHTML += `
                            <a href="${item.link}" target="_blank" class="card" style="background-image: url('${item.imagem}');">
                                <div class="card-info">${item.nome.toUpperCase()}</div>
                            </a>`;
                    }
                });
            } catch (erro) {
                document.getElementById('loading').innerText = "Erro ao conectar com o banco de dados.";
            }
        }
        carregarBanners();
    </script>
</body>
</html>
