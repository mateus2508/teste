<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NetLinks Cloud</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #141414; color: #fff; font-family: sans-serif; margin: 0; background-size: cover; background-attachment: fixed; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: -1; }
        #painel { padding: 20px 5%; display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .card-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
        .card-wrap { position: relative; width: 250px; height: 140px; border-radius: 8px; overflow: hidden; border: 2px solid #333; }
        .card { display: block; width: 100%; height: 100%; background-size: cover; text-decoration: none; }
        .card-info { background: rgba(0,0,0,0.5); height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase; }
        .edit-btn { position: absolute; top: 5px; right: 5px; background: #000; color: #fff; border: none; border-radius: 50%; cursor: pointer; padding: 5px; width: 25px; height: 25px; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="login" style="text-align:center; margin-top:100px;">
        <h1>NetLinks</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel">
        <header class="header">
            <div id="clock">00:00</div>
            <div style="display:flex; gap:20px; align-items:center;">
                <button onclick="setFundo()"><i class="fas fa-image"></i></button>
                <div id="userBadge"></div>
                <button onclick="localStorage.clear(); location.reload();"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <div id="content"></div>
    </div>

    <script>
        const urlApp = "SUA_URL_DO_SCRIPT_AQUI"; // <--- COLE O LINK DO SCRIPT AQUI

        window.onload = function() {
            const email = localStorage.getItem("u_mail");
            if (email) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('u_pic')}" style="width:25px; border-radius:50%">`;
                load(email);
            } else {
                google.accounts.id.initialize({ client_id: "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com", callback: r => {
                    const d = JSON.parse(atob(r.credential.split('.')[1]));
                    localStorage.setItem("u_mail", d.email); localStorage.setItem("u_pic", d.picture);
                    location.reload();
                }});
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {theme:"outline"});
            }
        };

        async function load(email) {
            const res = await fetch(`${urlApp}?dono=${email}`);
            const d = await res.json();
            if (d.fundo) document.body.style.backgroundImage = `url('${d.fundo}')`;
            
            const cont = document.getElementById('content');
            cont.innerHTML = "";
            d.categorias.forEach(cat => {
                let html = `<h3>${cat}</h3><div class="card-row">`;
                d.banners.filter(b => b.cat == cat).forEach(b => {
                    html += `<div class="card-wrap">
                        <button class="edit-btn" onclick="setBanner('${b.nome}')"><i class="fas fa-pen"></i></button>
                        <a href="${b.link}" target="_blank" class="card" style="background-image:url('${b.img}')"><div class="card-info">${b.nome}</div></a>
                    </div>`;
                });
                cont.innerHTML += html + `</div>`;
            });
        }

        function setFundo() {
            const u = prompt("Link do fundo:");
            if(u) fetch(`${urlApp}?action=saveBackground&dono=${localStorage.getItem("u_mail")}&fundo=${u}`).then(()=>location.reload());
        }

        function setBanner(nome) {
            const u = prompt("Link da imagem do banner:");
            if(u) fetch(`${urlApp}?action=updateBanner&dono=${localStorage.getItem("u_mail")}&nome=${nome}&imagem=${u}`).then(()=>location.reload());
        }
    </script>
</body>
</html>
