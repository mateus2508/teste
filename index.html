<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NetLinks - Estável</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; }
        body { background-color: var(--bg); color: #fff; font-family: Arial, sans-serif; margin: 0; background-size: cover; background-position: center; background-attachment: fixed; }
        #painel { display: none; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .categoria-bloco { margin-top: 30px; }
        .titulo-cat { border-left: 4px solid var(--primary); padding-left: 10px; text-transform: uppercase; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        .card { width: 280px; height: 150px; border-radius: 8px; border: 2px solid #333; background-size: cover; background-position: center; position: relative; text-decoration: none; color: #fff; transition: 0.3s; }
        .card:hover { transform: scale(1.03); border-color: #fff; }
        .info { background: rgba(0,0,0,0.6); height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; border-radius: 6px; }
        .edit-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); border: none; color: #fff; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="login" style="text-align:center; margin-top:100px;">
        <h1 style="color:var(--primary)">NETLINKS</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel">
        <header class="header">
            <div id="clock">00:00</div>
            <div style="display:flex; gap:15px; align-items:center;">
                <button onclick="mudarFundo()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-image"></i></button>
                <div id="userBadge"></div>
                <button onclick="logout()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <div id="conteudo"></div>
    </div>

    <script>
        // ATENÇÃO: COLOQUE SUA URL DO SCRIPT ABAIXO
        const urlApp = "COLE_AQUI_A_SUA_URL_DO_SCRIPT"; 

        window.onload = function() {
            const email = localStorage.getItem("u_mail");
            if (email) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
                carregar(email);
            } else {
                google.accounts.id.initialize({ 
                    client_id: "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com", 
                    callback: r => {
                        const d = JSON.parse(atob(r.credential.split('.')[1]));
                        localStorage.setItem("u_mail", d.email);
                        localStorage.setItem("u_pic", d.picture);
                        location.reload();
                    }
                });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {theme:"outline", size:"large"});
            }
        };

        async function carregar(email) {
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(email)}`);
                const d = await res.json();
                
                if(d.fundo_tela) document.body.style.backgroundImage = `url('${d.fundo_tela}')`;
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('u_pic')}" style="width:30px; border-radius:50%">`;

                const cont = document.getElementById('conteudo');
                cont.innerHTML = "";

                d.categorias.forEach(cat => {
                    let html = `<div class="categoria-bloco"><h2 class="titulo-cat">${cat}</h2><div class="fileira">`;
                    
                    const linksDaCat = d.banners.filter(b => b.categoria == cat);
                    linksDaCat.forEach(b => {
                        html += `
                            <div style="position:relative">
                                <button class="edit-btn" onclick="mudarBanner('${b.nome}')"><i class="fas fa-pen"></i></button>
                                <a href="${b.link}" target="_blank" class="card" style="background-image:url('${b.imagem}')">
                                    <div class="info">${b.nome}</div>
                                </a>
                            </div>`;
                    });
                    cont.innerHTML += html + `</div></div>`;
                });
            } catch (e) { document.getElementById('conteudo').innerHTML = "Erro ao carregar dados."; }
        }

        async function mudarFundo() {
            const u = prompt("Link da imagem de fundo:");
            if(u) {
                const email = localStorage.getItem("u_mail");
                await fetch(`${urlApp}?action=saveBackground&dono=${encodeURIComponent(email)}&fundo=${encodeURIComponent(u)}`, {mode:'no-cors'});
                location.reload();
            }
        }

        async function mudarBanner(nome) {
            const u = prompt("Link da nova imagem para " + nome + ":");
            if(u) {
                const email = localStorage.getItem("u_mail");
                await fetch(`${urlApp}?action=updateBanner&dono=${encodeURIComponent(email)}&nome=${encodeURIComponent(nome)}&imagem=${encodeURIComponent(u)}`, {mode:'no-cors'});
                location.reload();
            }
        }

        function logout() { localStorage.clear(); location.reload(); }
        setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    </script>
</body>
</html>
