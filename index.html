<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks - Organizador</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
        body { background-color: var(--bg); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* LOGIN CONTAINER */
        #login-container { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); }
        .hero-title { font-size: clamp(2.5rem, 8vw, 4rem); color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 5px; font-weight: 900; }
        .hero-desc { max-width: 700px; color: #ccc; font-size: 1.1rem; margin: 25px 0; }
        
        /* Espaço garantido para o botão não sumir */
        #buttonDiv { min-height: 50px; margin-top: 20px; display: flex; justify-content: center; }

        /* PAINEL */
        #painel-principal { display: none; padding: 20px 4% 140px 4%; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #444; }
        .user-badge img { width: 28px; border-radius: 50%; border: 1px solid var(--primary); }

        /* BANNERS ESTILO NETFLIX */
        .categoria-titulo { font-size: 1.2rem; margin: 40px 0 20px 0; border-left: 5px solid var(--primary); padding-left: 15px; text-transform: uppercase; font-weight: bold; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; justify-content: flex-start; }
        .card { flex: 1 1 220px; max-width: 350px; height: 140px; background-color: var(--card); background-size: cover; background-position: center; border-radius: 8px; text-decoration: none; color: white; transition: 0.4s; overflow: hidden; border: 2px solid #333; position: relative; }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }
        .card-info { background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 100%); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; padding: 15px; box-sizing: border-box; text-transform: uppercase; font-size: 1.1rem; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px rgba(0,0,0,0.8); }

        .btn-icon { color: white; text-decoration: none; font-size: 20px; background: none; border: none; cursor: pointer; }
        .footer { background: #000; padding: 30px 4%; border-top: 1px solid #333; color: #666; font-size: 13px; margin-top: auto; }
    </style>
</head>
<body>

    <div id="login-container">
        <h1 class="hero-title">NetLinks</h1>
        <p class="hero-desc">Entre com a sua conta Google para aceder aos seus links.</p>
        <div id="buttonDiv"></div> </div>

    <div id="painel-principal">
        <div class="header">
            <a href="index.html" class="logo-small">NetLinks</a>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="userBadge" class="user-badge"></div>
                <a href="settings.html" class="btn-icon"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" class="btn-icon"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div id="categorias-container"></div>
    </div>

    <footer class="footer">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <span>&copy; 2026 NetLinks.</span>
            <a href="sobre.html" style="color:#888; text-decoration:none;"><i class="fas fa-user-code"></i> Sobre o Criador</a>
        </div>
    </footer>

    <script>
        const CLIENT_ID = "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com";
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";

        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            localStorage.setItem("netlinks_user", data.email);
            localStorage.setItem("netlinks_name", data.name);
            localStorage.setItem("netlinks_pic", data.picture);
            location.reload();
        }

        window.onload = function () {
            const email = localStorage.getItem("netlinks_user");
            
            if (email) {
                document.getElementById('painel-principal').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `
                    <img src="${localStorage.getItem('netlinks_pic')}">
                    <span>${localStorage.getItem('netlinks_name')}</span>
                `;
                carregarDados(email);
            } else {
                document.getElementById('login-container').style.display = 'flex';
                // Inicializa a Google apenas se não estiver logado
                google.accounts.id.initialize({
                    client_id: CLIENT_ID,
                    callback: handleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("buttonDiv"),
                    { theme: "outline", size: "large", text: "signin_with", shape: "pill" }
                );
            }
        };

        async function carregarDados(email) {
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(email)}`);
                const dados = await res.json();
                const container = document.getElementById('categorias-container');
                container.innerHTML = "";

                dados.categorias.forEach(cat => {
                    const idCat = cat.toLowerCase().replace(/\s+/g, '-');
                    container.innerHTML += `<div class="categoria-titulo">${cat}</div><div class="fileira" id="container-${idCat}"></div>`;
                });

                dados.banners.forEach(item => {
                    const idCat = item.categoria.toLowerCase().replace(/\s+/g, '-');
                    const fileira = document.getElementById(`container-${idCat}`);
                    if (fileira) {
                        let img = item.imagem || "https://drive.google.com/thumbnail?id=1OyRgCJqj0SASvlxkbPBWxh8SYRYJJc2N&sz=w1000";
                        if (img.includes("drive.google.com")) {
                            const id = img.split('id=')[1] || img.split('/d/')[1].split('/')[0];
                            img = `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
                        }
                        fileira.innerHTML += `
                            <a href="${item.link}" target="_blank" class="card" style="background-image: url('${img}');">
                                <div class="card-info">${item.nome}</div>
                            </a>`;
                    }
                });
            } catch (e) { console.error(e); }
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
