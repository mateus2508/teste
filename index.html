<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks - Home</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; }
        body { background-color: var(--bg); color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; background-size: cover; background-position: center; background-attachment: fixed; transition: 0.5s; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }
        #login-container { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        #painel { display: none; padding: 20px 5%; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 30px; }
        .clock { font-size: 1.5rem; font-weight: bold; }
        .search-container { flex: 1; max-width: 400px; position: relative; margin: 0 20px; }
        #searchInput { width: 100%; padding: 10px 15px 10px 40px; border-radius: 20px; border: 1px solid #444; background: rgba(0,0,0,0.6); color: #fff; outline: none; }
        .search-container i { position: absolute; left: 15px; top: 12px; color: #888; }
        .categoria-titulo { font-size: 1.3rem; border-left: 4px solid var(--primary); padding-left: 12px; margin: 40px 0 15px; text-transform: uppercase; letter-spacing: 1px; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        .card-wrapper { position: relative; flex: 1 1 240px; max-width: 350px; }
        .card { display: block; height: 150px; background-size: cover; background-position: center; border-radius: 8px; border: 2px solid #333; text-decoration: none; overflow: hidden; transition: 0.4s; }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }
        .card-info { background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 15px; font-weight: bold; text-align: center; color: #fff; text-shadow: 2px 2px 4px #000; }
        .edit-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border: none; color: #fff; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: none; z-index: 10; align-items: center; justify-content: center; }
        .card-wrapper:hover .edit-btn { display: flex; }
        .edit-btn:hover { background: var(--primary); }
        .user-pic { width: 35px; border-radius: 50%; border: 2px solid var(--primary); }
        .btn-top { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; transition: 0.3s; }
        .btn-top:hover { color: var(--primary); transform: scale(1.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="login-container">
        <h1 style="color:var(--primary); font-size: 3.5rem; margin-bottom: 0;">NETLINKS</h1>
        <p style="color:#aaa; margin-bottom: 30px;">Sua biblioteca pessoal de links</p>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel">
        <header class="header">
            <div id="clock" class="clock">00:00</div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar..." onkeyup="filtrar()">
            </div>
            <div style="display:flex; align-items:center; gap:20px">
                <button onclick="mudarFundo()" class="btn-top" title="Trocar Fundo"><i class="fas fa-image"></i></button>
                <div id="userBadge"></div>
                <a href="settings.html" class="btn-top" title="Configurações"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" class="btn-top" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <div id="main-content"></div>
    </div>

    <script>
        const urlApp = "COLE_AQUI_A_SUA_URL_DO_SCRIPT"; // <--- COLOQUE SEU LINK AQUI

        window.onload = function() {
            const email = localStorage.getItem("u_mail");
            if (email) {
                document.getElementById('painel').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('u_pic')}" class="user-pic">`;
                carregar(email);
            } else {
                document.getElementById('login-container').style.display = 'flex';
                google.accounts.id.initialize({ 
                    client_id: "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com", 
                    callback: r => {
                        const d = JSON.parse(atob(r.credential.split('.')[1]));
                        localStorage.setItem("u_mail", d.email); localStorage.setItem("u_pic", d.picture);
                        location.reload();
                    }
                });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {theme:"outline", size:"large"});
            }
        };

        async function carregar(email) {
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(email)}`);
                const d = await res.json();
                if(d.fundo_tela) document.body.style.backgroundImage = `url('${d.fundo_tela}')`;
                
                const c = document.getElementById('main-content');
                c.innerHTML = "";
                if(d.categorias.length === 0) {
                    c.innerHTML = "<p style='text-align:center; color:#666;'>Nenhum link encontrado. Vá em configurações para adicionar.</p>";
                }
                d.categorias.forEach(cat => {
                    let html = `<div class="categoria-titulo">${cat}</div><div class="fileira">`;
                    d.banners.filter(b => b.categoria == cat).forEach(b => {
                        html += `
                        <div class="card-wrapper">
                            <button class="edit-btn" onclick="mudarBanner('${b.nome}')"><i class="fas fa-pen"></i></button>
                            <a href="${b.link}" target="_blank" class="card" style="background-image:url('${b.imagem}')">
                                <div class="card-info">${b.nome}</div>
                            </a>
                        </div>`;
                    });
                    c.innerHTML += html + `</div>`;
                });
            } catch (e) { console.error("Erro ao carregar:", e); }
        }

        async function mudarFundo() {
            const u = prompt("Link da imagem de fundo:");
            if(u) {
                const email = localStorage.getItem("u_mail");
                await fetch(`${urlApp}?action=saveBackground&dono=${encodeURIComponent(email)}&fundo=${encodeURIComponent(u)}`, {mode: 'no-cors'});
                alert("Fundo atualizado!");
                location.reload();
            }
        }

        async function mudarBanner(nome) {
            const u = prompt("Link da nova imagem para " + nome + ":");
            if(u) {
                const email = localStorage.getItem("u_mail");
                await fetch(`${urlApp}?action=updateBanner&dono=${encodeURIComponent(email)}&nome=${encodeURIComponent(nome)}&imagem=${encodeURIComponent(u)}`, {mode: 'no-cors'});
                alert("Banner atualizado!");
                location.reload();
            }
        }

        function filtrar() {
            const t = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card-wrapper').forEach(w => w.classList.toggle('hidden', !w.innerText.toLowerCase().includes(t)));
        }

        function logout() { localStorage.clear(); location.reload(); }
        setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    </script>
</body>
</html>
