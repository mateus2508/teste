<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks Gestão</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: Arial, sans-serif; padding: 20px 4%; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #E50914; margin: 0; }
        .btn-cadastro { background: #E50914; color: white; text-decoration: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; }
        .categoria-titulo { font-size: 1.2rem; margin: 25px 0 10px 0; border-left: 4px solid #E50914; padding-left: 10px; text-transform: uppercase; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; min-height: 50px; }
        .card { flex: 1 1 calc(20% - 15px); min-width: 200px; height: 120px; background-color: #2f2f2f; background-size: cover; background-position: center; border-radius: 4px; text-decoration: none; color: white; position: relative; border: 2px solid transparent; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border-color: white; }
        .card-info { background: rgba(0,0,0,0.7); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; padding: 10px; box-sizing: border-box; }
        #loading { text-align: center; color: #E50914; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>NetLinks Gestão</h1>
        <a href="cadastro.html" class="btn-cadastro">+ CADASTRAR NOVO</a>
    </div>

    <div id="loading">Carregando banners...</div>

    <div class="categoria-titulo">SISTEMAS</div>
    <div class="fileira" id="container-sistemas"></div>

    <div class="categoria-titulo">CITR</div>
    <div class="fileira" id="container-citr"></div>

    <div class="categoria-titulo">CISL</div>
    <div class="fileira" id="container-cisl"></div>

    <div class="categoria-titulo">PAGAMENTOS</div>
    <div class="fileira" id="container-pagamentos"></div>

    <div class="categoria-titulo">MATERIAIS</div>
    <div class="fileira" id="container-materiais"></div>

    <div class="categoria-titulo">GESTÃO DE EQUIPE</div>
    <div class="fileira" id="container-gestao"></div>

    <script>
        async function carregar() {
            // LINK DA WEB ATUALIZADO
            const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
            
            try {
                const res = await fetch(urlApp);
                const dados = await res.json();
                
                document.getElementById('loading').style.display = 'none';

                dados.forEach(item => {
                    let catId = item.categoria.toLowerCase()
                        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                        .replace("gestao de equipe", "gestao");

                    const container = document.getElementById(`container-${catId}`);
                    
                    if (container) {
                        container.innerHTML += `
                            <a href="${item.link}" target="_blank" class="card" style="background-image: url('${item.imagem}');">
                                <div class="card-info">${item.nome.toUpperCase()}</div>
                            </a>`;
                    }
                });
            } catch (e) { 
                document.getElementById('loading').innerText = "Erro ao carregar banners.";
            }
        }
        carregar();
    </script>
</body>
</html>
