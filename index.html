<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NetLinks - Home</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; }
        body { 
            background: var(--bg); color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            margin: 0; background-size: cover; background-position: center; background-attachment: fixed;
        }
        /* Overlay para garantir leitura do texto */
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); z-index: -1; }
        
        #painel { display: none; padding: 10px 4%; }
        
        /* HEADER COM LOGO E RELÓGIO */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 20px;
        }
        .logo-netlinks { color: var(--primary); font-size: 2rem; font-weight: 900; letter-spacing: 3px; text-decoration: none; }
        .clock { font-size: 1.2rem; color: #aaa; margin-left: 20px; }

        /* GRID DE CARDS */
        .categoria-titulo { font-size: 1.3rem; border-left: 4px solid var(--primary); padding-left: 12px; margin: 40px 0 15px; text-transform: uppercase; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        .card-wrapper { position: relative; flex: 0 0 240px; }
        .card { 
            display: block; height: 140px; background-color: #222; 
            background-size: cover; background-position: center; 
            border-radius: 4px; border: 1px solid #333; text-decoration: none; 
            overflow: hidden; transition: 0.3s; 
        }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }
        .card-info { 
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); 
            height: 100%; display: flex; align-items: flex-end; 
            justify-content: center; padding-bottom: 15px; 
            font-weight: bold; text-align: center; color: #fff; font-size: 0.8rem;
        }
        
        /* BOTÕES */
        .edit-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); border: none; color: #fff; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: none; z-index: 10; align-items: center; justify-content: center; }
        .card-wrapper:hover .edit-btn { display: flex; }
        .user-pic { width: 35px; border-radius: 50%; border: 2px solid #444; }
        .btn-top { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    
    <div id="login-container" style="display:none; text-align:center; margin-top:15vh;">
        <h1 style="color:var(--primary); font-size: 4rem; letter-spacing: 8px;">NETLINKS</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel">
        <header class="header">
            <div style="display:flex; align-items:center;">
                <div class="logo-netlinks">NETLINKS</div>
                <div id="clock" class="clock">00:00</div>
            </div>
            
            <div style="display:flex; align-items:center; gap:20px">
                <button onclick="mudarFundo()" class="btn-top"><i class="fas fa-palette"></i></button>
                <div id="userBadge"></div>
                <button onclick="localStorage.clear(); location.reload();" class="btn-top"><i class="fas fa-power-off"></i></button>
            </div>
        </header>

        <div id="corpo">Carregando seus links...</div>
    </div>

    <script>
        // MANTENHA A SUA URL DO SCRIPT QUE JÁ FUNCIONA ABAIXO
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec"; 

        window.onload = function() {
            const email = localStorage.getItem("u_mail");
            if (email) {
                document.getElementById('painel').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('u_pic')}" class="user-pic">`;
                carregar(email);
            } else {
                document.getElementById('login-container').style.display = 'block';
                google.accounts.id.initialize({ 
                    client_id: "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com", 
                    callback: r => {
                        const d = JSON.parse(atob(r.credential.split('.')[1]));
                        localStorage.setItem("u_mail", d.email); localStorage.setItem("u_pic", d.picture);
                        location.reload();
                    }
                });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {size:"large"});
            }
        };

        async function carregar(email) {
            try {
                const res = await fetch(urlApp + "?dono=" + encodeURIComponent(email));
                const d = await res.json();
                
                if(d.fundo_tela) document.body.style.backgroundImage = "url('" + d.fundo_tela + "')";
                
                let html = "";
                d.categorias.forEach(cat => {
                    html += `<div class="categoria-titulo">${cat}</div><div class="fileira">`;
                    d.banners.filter(b => b.categoria == cat).forEach(b => {
                        let img = b.imagem ? `style="background-image:url('${b.imagem}')"` : "";
                        html += `
                        <div class="card-wrapper">
                            <button class="edit-btn" onclick="mudarBanner('${b.nome}')"><i class="fas fa-pencil-alt"></i></button>
                            <a href="${b.link}" target="_blank" class="card" ${img}>
                                <div class="card-info">${b.nome}</div>
                            </a>
                        </div>`;
                    });
                    html += `</div>`;
                });
                document.getElementById('corpo').innerHTML = html;
            } catch (err) {
                document.getElementById('corpo').innerHTML = "Erro ao ler a planilha. Verifique a URL.";
            }
        }

        async function mudarFundo() {
            const u = prompt("URL da imagem de fundo:");
            if(u) {
                await fetch(urlApp + "?action=saveBackground&dono=" + encodeURIComponent(localStorage.getItem("u_mail")) + "&fundo=" + encodeURIComponent(u), {mode:'no-cors'});
                location.reload();
            }
        }

        async function mudarBanner(nome) {
            const u = prompt("URL da nova imagem para " + nome + ":");
            if(u) {
                await fetch(urlApp + "?action=updateBanner&dono=" + encodeURIComponent(localStorage.getItem("u_mail")) + "&nome=" + encodeURIComponent(nome) + "&imagem=" + encodeURIComponent(u), {mode:'no-cors'});
                location.reload();
            }
        }

        setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    </script>
</body>
</html>
