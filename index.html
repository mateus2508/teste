<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks - Oficial</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; }
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            transition: 0.5s;
        }
        /* Camada para garantir que o texto apareça mesmo com fundo claro */
        .bg-overlay { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.6); 
            z-index: -1; 
        }
        
        #login-container { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        #painel { display: none; padding: 10px 4%; }

        /* HEADER */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 20px; position: sticky; top: 0; 
            background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); z-index: 100; 
        }
        .logo-netlinks { color: var(--primary); font-size: 1.8rem; font-weight: 900; letter-spacing: 3px; text-decoration: none; }
        
        .header-left { display: flex; align-items: center; gap: 30px; }
        .clock { font-size: 1.1rem; color: #aaa; }
        
        .search-box { position: relative; width: 250px; }
        .search-box input { 
            width: 100%; padding: 8px 15px 8px 35px; border-radius: 4px; 
            border: 1px solid #444; background: #000; color: #fff; outline: none; 
        }
        .search-box i { position: absolute; left: 10px; top: 10px; color: #666; }

        .header-right { display: flex; align-items: center; gap: 20px; }

        /* CARDS */
        .categoria-titulo { font-size: 1.4rem; border-left: 4px solid var(--primary); padding-left: 12px; margin: 40px 0 20px; text-transform: uppercase; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        .card-wrapper { position: relative; flex: 0 0 240px; }
        .card { 
            display: block; height: 140px; background-color: #222; 
            background-size: cover; background-position: center; 
            border-radius: 4px; border: 1px solid #333; 
            text-decoration: none; overflow: hidden; transition: 0.3s; 
        }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }
        .card-info { 
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); 
            height: 100%; display: flex; align-items: flex-end; 
            justify-content: center; padding-bottom: 15px; 
            font-weight: bold; text-align: center; color: #fff; font-size: 0.8rem;
        }
        
        .edit-btn { 
            position: absolute; top: 8px; right: 8px; 
            background: rgba(0,0,0,0.8); border: none; color: #fff; 
            border-radius: 50%; width: 30px; height: 30px; 
            cursor: pointer; display: none; z-index: 10; 
            align-items: center; justify-content: center; 
        }
        .card-wrapper:hover .edit-btn { display: flex; }
        .user-pic { width: 35px; border-radius: 50%; border: 2px solid #444; }
        .btn-top { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }
        .btn-top:hover { color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>

        <h1 style="color:var(--primary); font-size: 4rem; letter-spacing: 8px;">NETLINKS</h1>
        <div id="buttonDiv"></div>
    </div>
