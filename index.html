<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTOR DE LINKS</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        #login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        #painel-principal { display: none; padding: 20px 4% 140px 4%; }
        h1 { color: #E50914; text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #444; }
        .user-badge img { width: 28px; border-radius: 50%; border: 1px solid #E50914; }
        .nav-btns { display: flex; align-items: center; gap: 10px; }
        .btn-config { color: white; text-decoration: none; padding: 10px; border-radius: 4px; background: #333; transition: 0.3s; }
        .btn-logout { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; }
        .categoria-titulo { font-size: 1.2rem; margin: 40px 0 20px 0; border-left: 5px solid #E50914; padding-left: 15px; text-transform: uppercase; font-weight: bold; }
        .fileira { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { flex: 0 1 calc(20% - 20px); min-width: 200px; height: 120px; background-color: #2f2f2f; background-size: cover; background-position: center; border-radius: 6px; text-decoration: none; color: white; transition: 0.4s; overflow: hidden; position: relative; }
        .card:hover { transform: scale(1.05); border: 2px solid white; z-index: 10; }
        .card-info { background: rgba(0,0,0,0.7); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; font-size: 14px; }
        .footer { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 20px 0; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div id="login-container">
        <h1 style="font-size: 3.5rem;">LinK Fácil</h1>
        <p style="color: #888; margin-bottom: 30px;">Acesse seu painel personalizado</p>
        <div id="buttonDiv"></div>
    </div>
    <div id="painel-principal">
        <div class="header">
            <h1>NetLinks</h1>
            <div class="nav-btns">
                <div class="user-badge" id="userBadge"></div>
                <a href="settings.html" class="btn-config"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div id="categorias-container"></div>
    </div>
    <footer class="footer"> &reg; 2024 - Mateus Padilha </footer>
    <script>
        const CLIENT_ID = "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com";
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";

        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            localStorage.setItem("netlinks_user", data.email);
            localStorage.setItem("netlinks_name", data.name);
            localStorage.setItem("netlinks_pic", data.picture);
            location.reload();
        }
        window.onload = function () {
            const email = localStorage.getItem("netlinks_user");
            if (email) {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('painel-principal').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('netlinks_pic')}"> ${localStorage.getItem('netlinks_name')}`;
                carregarDados(email);
            } else {
                google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "outline", size: "large" });
            }
        };
        async function carregarDados(email) {
            try {
                const res = await fetch(`${urlApp}?dono=${email}`);
                const dados = await res.json();
                const container = document.getElementById('categorias-container');
                dados.categorias.forEach(cat => {
                    const idCat = cat.toLowerCase().replace(/\s+/g, '-');
                    container.innerHTML += `<div class="categoria-titulo">${cat}</div><div class="fileira" id="container-${idCat}"></div>`;
                });
                dados.banners.forEach(item => {
                    const idCat = item.categoria.toLowerCase().replace(/\s+/g, '-');
                    const fileira = document.getElementById(`container-${idCat}`);
                    if (fileira) {
                        fileira.innerHTML += `<a href="${item.link}" target="_blank" class="card" style="background-image: url('${item.imagem}');"><div class="card-info">${item.nome}</div></a>`;
                    }
                });
            } catch (e) { console.error(e); }
        }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
