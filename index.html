<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks - Seu Organizador de Links</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
        body { background-color: var(--bg); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        #login-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); }
        .hero-title { font-size: 4rem; color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 5px; font-weight: 900; }
        .hero-desc { max-width: 700px; color: #ccc; font-size: 1.2rem; line-height: 1.6; margin: 25px 0 45px 0; }
        .features { display: flex; gap: 30px; margin-bottom: 50px; flex-wrap: wrap; justify-content: center; }
        .feat-item { font-size: 0.95rem; color: #aaa; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 30px; border: 1px solid #333; }
        .feat-item i { color: var(--primary); }
        #painel-principal { display: none; padding: 20px 4% 140px 4%; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .user-badge { display: flex; align-items: center; gap: 12px; background: #222; padding: 6px 18px; border-radius: 25px; font-size: 14px; border: 1px solid #444; }
        .user-badge img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--primary); }
        .btn-nav { color: #fff; text-decoration: none; font-size: 20px; transition: 0.3s; background: none; border: none; cursor: pointer; }
        .btn-nav:hover { color: var(--primary); transform: scale(1.1); }
        .categoria-titulo { font-size: 1.3rem; margin: 45px 0 20px 0; border-left: 6px solid var(--primary); padding-left: 15px; text-transform: uppercase; font-weight: bold; }
        .fileira { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { flex: 0 1 calc(20% - 20px); min-width: 220px; height: 130px; background-color: var(--card); background-size: cover; background-position: center; border-radius: 8px; text-decoration: none; color: white; transition: 0.4s; overflow: hidden; border: 2px solid transparent; }
        .card:hover { transform: scale(1.06); border-color: #fff; }
        .card-info { background: rgba(0,0,0,0.75); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; padding: 15px; box-sizing: border-box; }
        .footer { background: #000; padding: 40px 4%; border-top: 1px solid #333; color: #777; font-size: 14px; margin-top: auto; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 25px; }
        .footer-links a { color: #888; text-decoration: none; margin-left: 20px; transition: 0.3s; }
        .footer-links a:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div id="login-container">
        <h1 class="hero-title">NetLinks</h1>
        <p class="hero-desc">Sua central definitiva de organização. Categorize seus sites e ferramentas em um painel inteligente.</p>
        <div class="features">
            <span class="feat-item"><i class="fas fa-layer-group"></i> Categorias</span>
            <span class="feat-item"><i class="fas fa-bolt"></i> Agilidade</span>
            <span class="feat-item"><i class="fas fa-lock"></i> Google Login</span>
        </div>
        <div id="buttonDiv"></div>
    </div>
    <div id="painel-principal">
        <header class="header">
            <a href="index.html" class="logo-small">NetLinks</a>
            <div style="display: flex; gap: 20px; align-items: center;">
                <div class="user-badge" id="userBadge"></div>
                <a href="settings.html" class="btn-nav"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" class="btn-nav"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <div id="categorias-container"></div>
    </div>
    <footer class="footer">
        <div class="footer-content">
            <div>&copy; 2026 <strong>NetLinks</strong>.</div>
            <div class="footer-links">
                <a href="sobre.html"><i class="fas fa-user-astronaut"></i> Sobre o Criador</a>
            </div>
        </div>
    </footer>
    <script>
        const CLIENT_ID = "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com";
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            localStorage.setItem("netlinks_user", data.email);
            localStorage.setItem("netlinks_name", data.name);
            localStorage.setItem("netlinks_pic", data.picture);
            location.reload();
        }
        window.onload = function () {
            const email = localStorage.getItem("netlinks_user");
            if (email) {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('painel-principal').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('netlinks_pic')}"> ${localStorage.getItem('netlinks_name')}`;
                carregarDados(email);
            } else {
                google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "outline", size: "large", shape: "pill" });
            }
        };
        async function carregarDados(email) {
            try {
                const res = await fetch(`${urlApp}?dono=${email}`);
                const dados = await res.json();
                const container = document.getElementById('categorias-container');
                container.innerHTML = "";
                dados.categorias.forEach(cat => {
                    const idCat = cat.toLowerCase().replace(/\s+/g, '-');
                    container.innerHTML += `<div class="categoria-titulo">${cat}</div><div class="fileira" id="container-${idCat}"></div>`;
                });
                dados.banners.forEach(item => {
                    const idCat = item.categoria.toLowerCase().replace(/\s+/g, '-');
                    const fileira = document.getElementById(`container-${idCat}`);
                    if (fileira) {
                        let img = item.imagem || "https://drive.google.com/thumbnail?id=1OyRgCJqj0SASvlxkbPBWxh8SYRYJJc2N&sz=w1000";
                        if (img.includes("drive.google.com")) {
                            const id = img.split('id=')[1] || img.split('/d/')[1].split('/')[0];
                            img = `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
                        }
                        fileira.innerHTML += `<a href="${item.link}" target="_blank" class="card" style="background-image: url('${img}');"><div class="card-info">${item.nome}</div></a>`;
                    }
                });
            } catch (e) { console.error(e); }
        }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
