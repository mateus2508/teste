<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks Gestão</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 4%;
        }

        /* Topo com Título e Botão de Cadastro */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #E50914;
            font-size: 2rem;
            margin: 0;
        }

        .btn-cadastro {
            background-color: #E50914;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-cadastro:hover {
            background-color: #b20710;
        }

        .categoria-titulo {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 25px 0 10px 0;
            color: #e5e5e5;
            border-left: 4px solid #E50914;
            padding-left: 10px;
        }

        /* --- GRID SEM ROLAGEM HORIZONTAL --- */
        .fileira {
            display: flex;
            flex-wrap: wrap; 
            gap: 15px;
            padding: 10px 0;
        }

        /* --- O CARD --- */
        .card {
            flex: 1 1 calc(20% - 15px); 
            min-width: 200px;
            height: 125px;
            background-color: #2f2f2f;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            position: relative;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease, border 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: scale(1.05);
            z-index: 10;
            border: 2px solid white;
        }

        .card-info {
            background: rgba(0,0,0,0.6);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        .card:hover .card-info {
            background: rgba(229, 9, 20, 0.85);
        }

        /* Responsividade para Celular */
        @media (max-width: 600px) {
            .card {
                flex: 1 1 calc(45% - 10px);
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header">

    </div>

            <div class="card-info">AVATO</div>
        </a>
        <a href="https://docpro.brasiltecpar.com.br/gmud/usuario" target="_blank" class="card" style="background-image: url('https://lh3.googleusercontent.com/u/0/d/10FFnKjiJI165SYx-uUhGNeMEKnPHUG4B');">
            <div class="card-info">DOCPRO</div>
        </a>
        <a href="https://servicedesk.brasiltecpar.com.br/attendance#/waiting-attendance" target="_blank" class="card" style="background-image: url('https://lh3.googleusercontent.com/u/0/d/14hsCAN4zh_EaMixrgoIl5dssQsubuL-y'); background-color: white;">
            <div class="card-info" style="color: black; background: rgba(255,255,255,0.3);">VOALLE</div>

        <a href="https://platform.senior.com.br/login/?redirectTo=https%3A%2F%2Fplatform.senior.com.br%2Fsenior-x%2F&tenant=brasiltec" target="_blank" class="card" style="background-image: url('https://lh3.googleusercontent.com/u/0/d/1OH5lMbGTc3zJMx1fkyfFbynzFIw11Vqq');">
            <div class="card-info">SENNIOR</div>

</body>
</html>
