<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks - Oficial</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
        body { background-color: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; background-size: cover; background-position: center; background-attachment: fixed; transition: background 0.5s; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; display: none; }
        #painel-principal { display: none; padding: 20px 4% 140px 4%; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .logo-small { color: var(--primary); font-size: 1.8rem; font-weight: bold; text-decoration: none; }
        .search-container { flex: 1; max-width: 400px; position: relative; margin: 0 20px; }
        #searchInput { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #444; background: #222; color: #fff; outline: none; }
        .categoria-header { border-left: 5px solid var(--primary); padding-left: 15px; margin: 30px 0 15px; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        .card-wrapper { position: relative; flex: 1 1 220px; max-width: 350px; }
        .card { display: block; height: 140px; background-size: cover; background-position: center; border-radius: 8px; border: 2px solid #333; text-decoration: none; color: #fff; overflow: hidden; }
        .edit-banner-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); border: none; color: #fff; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: none; z-index: 10; align-items: center; justify-content: center; }
        .card-wrapper:hover .edit-banner-btn { display: flex; }
        .card-info { background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; }
        .user-badge img { width: 28px; border-radius: 50%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-overlay" id="bgOverlay"></div>
    <div id="login" style="display:none; text-align:center; margin-top:20vh;">
        <h1 style="color:var(--primary); font-size: 4rem;">NetLinks</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel-principal">
        <header class="header">
            <a href="index.html" class="logo-small">NetLinks</a>
            <div class="search-container"><input type="text" id="searchInput" placeholder="Buscar link..." onkeyup="filtrar()"></div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button onclick="mudarFundo()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-image"></i></button>
                <div id="userBadge" class="user-badge"></div>
                <a href="settings.html" style="color:#fff;"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <main id="corpo"></main>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";

        window.onload = function() {
            const e = localStorage.getItem("u_mail");
            if (e) {
                document.getElementById('painel-principal').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('u_pic')}">`;
                carregar(e);
            } else {
                document.getElementById('login').style.display = 'block';
                google.accounts.id.initialize({
                    client_id: "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com",
                    callback: r => {
                        const d = JSON.parse(atob(r.credential.split('.')[1]));
                        localStorage.setItem("u_mail", d.email); localStorage.setItem("u_pic", d.picture);
                        location.reload();
                    }
                });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {size:"large"});
            }
        };

        async function carregar(e) {
            const r = await fetch(urlApp + "?dono=" + encodeURIComponent(e));
            const d = await r.json();
            if (d.fundo_tela) { 
                document.body.style.backgroundImage = `url('${d.fundo_tela}')`; 
                document.getElementById('bgOverlay').style.display = 'block';
            }
            let h = "";
            d.categorias.forEach(cat => {
                h += `<div class="cat-sec"><div class="categoria-header"><h2>${cat}</h2></div><div class="fileira">`;
                d.banners.filter(b => b.categoria == cat).forEach(b => {
                    h += `<div class="card-wrapper">
                        <button class="edit-banner-btn" onclick="mudarBanner('${b.nome}')"><i class="fas fa-pen"></i></button>
                        <a href="${b.link}" target="_blank" class="card" style="background-image:url('${b.imagem}')"><div class="card-info">${b.nome}</div></a>
                    </div>`;
                });
                h += `</div></div>`;
            });
            document.getElementById('corpo').innerHTML = h;
        }

        async function mudarFundo() {
            const u = prompt("URL da imagem de fundo:");
            if(u) {
                const e = localStorage.getItem("u_mail");
                await fetch(`${urlApp}?action=saveBackground&dono=${encodeURIComponent(e)}&fundo=${encodeURIComponent(u)}`, {mode:'no-cors'});
                location.reload();
            }
        }

        async function mudarBanner(nome) {
            const u = prompt("Nova imagem para " + nome + ":");
            if(u) {
                const e = localStorage.getItem("u_mail");
                await fetch(`${urlApp}?action=updateBanner&dono=${encodeURIComponent(e)}&nome=${encodeURIComponent(nome)}&imagem=${encodeURIComponent(u)}`, {mode:'no-cors'});
                location.reload();
            }
        }

        function filtrar() {
            const t = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card-wrapper').forEach(w => w.classList.toggle('hidden', !w.innerText.toLowerCase().includes(t)));
        }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
