<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks - Cloud Sync</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; }
        body { background-color: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; background-size: cover; background-position: center; background-attachment: fixed; transition: 0.5s; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; display: none; }
        #login-container { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; }
        #painel-principal { display: none; padding: 20px 5%; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 30px; gap: 20px; }
        .search-container { flex: 1; max-width: 450px; position: relative; }
        #searchInput { width: 100%; padding: 12px 15px 12px 45px; border-radius: 25px; border: 1px solid #444; background: rgba(30,30,30,0.8); color: #fff; outline: none; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
        .card-wrapper { position: relative; flex: 1 1 220px; max-width: 320px; }
        .card { display: block; height: 140px; background-size: cover; background-position: center; border-radius: 10px; border: 2px solid #333; text-decoration: none; position: relative; overflow: hidden; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }
        .card-info { background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 15px; font-weight: bold; text-align: center; color: #fff; text-transform: uppercase; }
        .edit-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); border: none; color: #fff; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: none; z-index: 10; align-items: center; justify-content: center; }
        .card-wrapper:hover .edit-btn { display: flex; }
        .categoria-titulo { font-size: 1.1rem; border-left: 4px solid var(--primary); padding-left: 12px; margin-bottom: 15px; text-transform: uppercase; }
        .footer { padding: 20px; text-align: center; color: #555; font-size: 12px; border-top: 1px solid #222; margin-top: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-overlay" id="bgOverlay"></div>
    <div id="login-container">
        <h1 style="color:var(--primary); font-size: 3.5rem;">NetLinks</h1>
        <div id="buttonDiv"></div>
    </div>
    <div id="painel-principal">
        <header class="header">
            <div id="clock" style="font-weight:bold; font-size:1.3rem;">00:00</div>
            <div class="search-container">
                <i class="fas fa-search" style="position:absolute; left:18px; top:15px; color:#666"></i>
                <input type="text" id="searchInput" placeholder="Buscar links..." onkeyup="filtrar()">
            </div>
            <div style="display:flex; align-items:center; gap:18px">
                <button onclick="mudarFundo()" title="Trocar Fundo" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.2rem"><i class="fas fa-image"></i></button>
                <div id="userBadge"></div>
                <a href="settings.html" style="color:#fff; font-size:1.2rem"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.2rem"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <div id="main-content">Carregando links...</div>
    </div>
    <footer class="footer">&copy; 2026 NetLinks - Sincronizado</footer>

    <script>
        const CLIENT_ID = "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com";
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);

        window.onload = function() {
            updateClock();
            const email = localStorage.getItem("netlinks_user");
            if (email) {
                document.getElementById('painel-principal').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('netlinks_pic')}" style="width:30px; border-radius:50%; border:1px solid var(--primary)">`;
                carregar(email);
            } else {
                document.getElementById('login-container').style.display = 'flex';
                google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => {
                    const d = JSON.parse(atob(r.credential.split('.')[1]));
                    localStorage.setItem("netlinks_user", d.email);
                    localStorage.setItem("netlinks_name", d.name);
                    localStorage.setItem("netlinks_pic", d.picture);
                    location.reload();
                }});
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {theme:"outline", size:"large", shape:"pill"});
            }
        };

        async function carregar(email) {
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(email)}`);
                const d = await res.json();
                if(d.fundo_tela) {
                    document.body.style.backgroundImage = `url('${d.fundo_tela}')`;
                    document.getElementById('bgOverlay').style.display = 'block';
                }
                const c = document.getElementById('main-content');
                c.innerHTML = "";
                d.categorias.forEach(cat => {
                    const id = cat.toLowerCase().replace(/\s+/g, '-');
                    c.innerHTML += `<div class="categoria-titulo">${cat}</div><div class="fileira" id="container-${id}"></div>`;
                });
                d.banners.forEach((b, idx) => {
                    const id = b.categoria.toLowerCase().replace(/\s+/g, '-');
                    const f = document.getElementById(`container-${id}`);
                    if(f) {
                        let img = b.imagem || "";
                        if (img.includes("drive.google.com")) {
                            const drvId = img.split('id=')[1] || img.split('/d/')[1].split('/')[0];
                            img = `https://drive.google.com/uc?id=${drvId}`;
                        }
                        f.innerHTML += `
                        <div class="card-wrapper">
                            <button class="edit-btn" onclick="mudarImagemBanner('${b.nome}', '${email}')"><i class="fas fa-pen"></i></button>
                            <a href="${b.link}" target="_blank" class="card" style="background-image:url('${img}')">
                                <div class="card-info">${b.nome}</div>
                            </a>
                        </div>`;
                    }
                });
            } catch (e) { console.error(e); }
        }

        async function mudarFundo() {
            const e = localStorage.getItem("netlinks_user");
            const u = prompt("Link da imagem de fundo:");
            if(u) {
                document.body.style.backgroundImage = `url('${u}')`;
                document.getElementById('bgOverlay').style.display = 'block';
                await fetch(urlApp, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "saveBackground", dono: e, fundo: u }) });
            }
        }

        async function mudarImagemBanner(nomeBanner, email) {
            const u = prompt("Link da nova imagem para o banner " + nomeBanner + ":");
            if(u) {
                // Envia para o script atualizar a imagem na planilha
                await fetch(urlApp, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: "updateBannerImage", dono: email, nome: nomeBanner, novaImagem: u }) 
                });
                alert("Imagem enviada! Recarregue em instantes.");
                location.reload();
            }
        }

        function filtrar() {
            const t = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card-wrapper').forEach(w => w.classList.toggle('hidden', !w.innerText.toLowerCase().includes(t)));
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
