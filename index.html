<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NetLinks - Rollback</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; }
        body { background: var(--bg); color: #fff; font-family: Arial, sans-serif; margin: 0; background-size: cover; background-position: center; background-attachment: fixed; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }
        #painel { display: none; padding: 20px 5%; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 30px; }
        .logo { color: var(--primary); font-size: 2rem; font-weight: bold; letter-spacing: 2px; }
        .search-box { position: relative; width: 300px; }
        .search-box input { width: 100%; padding: 8px 15px 8px 35px; border-radius: 20px; border: 1px solid #444; background: #000; color: #fff; outline: none; }
        .search-box i { position: absolute; left: 10px; top: 10px; color: #666; }
        .categoria-titulo { font-size: 1.2rem; border-left: 4px solid var(--primary); padding-left: 12px; margin: 30px 0 15px; text-transform: uppercase; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        .card { width: 230px; height: 130px; border-radius: 8px; border: 1px solid #333; background-size: cover; background-position: center; text-decoration: none; color: #fff; transition: 0.3s; position: relative; }
        .card:hover { transform: scale(1.05); border-color: #fff; }
        .card-info { background: rgba(0,0,0,0.6); height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; border-radius: 7px; padding: 5px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="login" style="text-align:center; margin-top:100px;">
        <h1 style="color:var(--primary); font-size: 3rem;">NETLINKS</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel">
        <header class="header">
            <div style="display:flex; align-items:center; gap:20px;">
                <div class="logo">NETLINKS</div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Pesquisar..." onkeyup="filtrar()">
                </div>
            </div>
            <button onclick="localStorage.clear(); location.reload();" style="color:#fff; background:none; border:1px solid #444; padding:5px 15px; cursor:pointer;">SAIR</button>
        </header>
        <div id="conteudo"></div>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec"; 

        window.onload = function() {
            const email = localStorage.getItem("u_mail");
            if (email) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
                carregar(email);
            } else {
                google.accounts.id.initialize({ 
                    client_id: "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com", 
                    callback: r => {
                        const d = JSON.parse(atob(r.credential.split('.')[1]));
                        localStorage.setItem("u_mail", d.email); location.reload();
                    }
                });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {size:"large"});
            }
        };

        async function carregar(email) {
            try {
                const res = await fetch(urlApp + "?dono=" + email);
                const d = await res.json();
                if(d.fundo_tela) document.body.style.backgroundImage = `url('${d.fundo_tela}')`;
                
                let html = "";
                d.categorias.forEach(cat => {
                    html += `<div class="cat-sec"><div class="categoria-titulo">${cat}</div><div class="fileira">`;
                    d.banners.filter(b => b.categoria == cat).forEach(b => {
                        let img = b.imagem ? `style="background-image:url('${b.imagem}')"` : "";
                        html += `<a href="${b.link}" target="_blank" class="card" ${img}><div class="card-info">${b.nome}</div></a>`;
                    });
                    html += `</div></div>`;
                });
                document.getElementById('conteudo').innerHTML = html;
            } catch (e) { console.error(e); }
        }

        function filtrar() {
            const t = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => c.classList.toggle('hidden', !c.innerText.toLowerCase().includes(t)));
        }
    </script>
</body>
</html>
