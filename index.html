<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NetLinks - Seu Painel</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
        body { background-color: var(--bg); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; min-height: 100vh; background-size: cover; background-position: center; background-attachment: fixed; transition: 0.5s; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }
        
        #login-container { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        #painel-principal { display: none; padding: 20px 5% 100px 5%; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 30px; }
        .clock { font-size: 1.5rem; font-weight: bold; color: #fff; }
        
        .search-container { flex: 1; max-width: 400px; position: relative; margin: 0 20px; }
        #searchInput { width: 100%; padding: 10px 15px 10px 40px; border-radius: 20px; border: 1px solid #444; background: rgba(0,0,0,0.6); color: #fff; outline: none; }
        .search-container i { position: absolute; left: 15px; top: 12px; color: #888; }

        .categoria-titulo { font-size: 1.2rem; border-left: 4px solid var(--primary); padding-left: 12px; margin: 30px 0 15px; text-transform: uppercase; letter-spacing: 1px; }
        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        
        .card-wrapper { position: relative; flex: 1 1 220px; max-width: 320px; }
        .card { display: block; height: 140px; background-size: cover; background-position: center; border-radius: 8px; border: 2px solid #333; text-decoration: none; position: relative; overflow: hidden; transition: 0.4s; }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }
        .card-info { background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 15px; font-weight: bold; text-align: center; color: #fff; text-transform: uppercase; }

        .edit-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); border: none; color: #fff; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: none; z-index: 10; align-items: center; justify-content: center; }
        .card-wrapper:hover .edit-btn { display: flex; }
        .edit-btn:hover { background: var(--primary); }

        .user-pic { width: 35px; border-radius: 50%; border: 2px solid var(--primary); }
        .btn-top { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .btn-top:hover { color: var(--primary); transform: scale(1.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="login-container">
        <h1 style="color:var(--primary); font-size: 3.5rem;">NetLinks</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel-principal">
        <header class="header">
            <div id="clock" class="clock">00:00</div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar links..." onkeyup="filtrar()">
            </div>
            <div style="display:flex; align-items:center; gap:20px">
                <button onclick="mudarFundo()" class="btn-top" title="Trocar Fundo"><i class="fas fa-image"></i></button>
                <div id="userBadge"></div>
                <a href="settings.html" class="btn-top" title="Configurações"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" class="btn-top" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <div id="main-content"></div>
    </div>

    <script>
        const urlApp = "COLE_AQUI_A_SUA_URL_DO_SCRIPT"; // <--- ATENÇÃO: COLE O LINK NOVO AQUI

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);

        window.onload = function() {
            updateClock();
            const email = localStorage.getItem("u_mail");
            if (email) {
                document.getElementById('painel-principal').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('u_pic')}" class="user-pic">`;
                carregar(email);
            } else {
                document.getElementById('login-container').style.display = 'flex';
                google.accounts.id.initialize({ 
                    client_id: "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com", 
                    callback: r => {
                        const d = JSON.parse(atob(r.credential.split('.')[1]));
                        localStorage.setItem("u_mail", d.email); localStorage.setItem("u_pic", d.picture);
                        location.reload();
                    }
                });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), {theme:"outline", size:"large"});
            }
        };

        async function carregar(email) {
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(email)}`);
                const d = await res.json();
                if(d.fundo) document.body.style.backgroundImage = `url('${d.fundo}')`;
                
                const c = document.getElementById('main-content');
                c.innerHTML = "";
                d.categorias.forEach(cat => {
                    let html = `<div class="categoria-titulo">${cat}</div><div class="fileira">`;
                    d.banners.filter(b => b.cat == cat).forEach(b => {
                        let img = b.img || "";
                        if (img.includes("drive.google.com")) {
                            const drvId = img.split('id=')[1] || img.split('/d/')[1].split('/')[0];
                            img = `https://drive.google.com/uc?id=${drvId}`;
                        }
                        html += `
                        <div class="card-wrapper">
                            <button class="edit-btn" onclick="mudarBanner('${b.nome}')"><i class="fas fa-pen"></i></button>
                            <a href="${b.link}" target="_blank" class="card" style="background-image:url('${img}')">
                                <div class="card-info">${b.nome}</div>
                            </a>
                        </div>`;
                    });
                    c.innerHTML += html + `</div>`;
                });
            } catch (e) { console.error(e); }
        }

        function mudarFundo() {
            const u = prompt("Link da imagem de fundo:");
            if(u) {
                const email = localStorage.getItem("u_mail");
                fetch(`${urlApp}?action=saveBackground&dono=${encodeURIComponent(email)}&fundo=${encodeURIComponent(u)}`)
                .then(() => location.reload());
            }
        }

        function mudarBanner(nome) {
            const u = prompt("Link da nova imagem para: " + nome);
            if(u) {
                const email = localStorage.getItem("u_mail");
                fetch(`${urlApp}?action=updateBanner&dono=${encodeURIComponent(email)}&nome=${encodeURIComponent(nome)}&imagem=${encodeURIComponent(u)}`)
                .then(() => location.reload());
            }
        }

        function filtrar() {
            const t = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card-wrapper').forEach(w => w.classList.toggle('hidden', !w.innerText.toLowerCase().includes(t)));
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
