<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
        
        body { 
            background-color: var(--bg); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;
            background-size: cover; background-position: center; background-attachment: fixed;
            transition: background 0.5s ease;
        }
        
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; display: none; }

        #login-container { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
        .hero-title { font-size: 3rem; color: var(--primary); font-weight: 900; letter-spacing: 5px; }

        #painel-principal { display: none; padding: 20px 4% 100px 4%; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; gap: 20px; }
        
        .datetime-container { text-align: left; line-height: 1.2; }
        #clock { font-size: 1.4rem; font-weight: bold; display: block; }
        #date { font-size: 0.75rem; color: #aaa; text-transform: uppercase; }

        .search-container { flex: 1; max-width: 400px; position: relative; }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }
        #searchInput { width: 100%; padding: 12px 15px 12px 45px; border-radius: 25px; border: 1px solid #444; background: rgba(34, 34, 34, 0.8); color: white; outline: none; box-sizing: border-box; backdrop-filter: blur(5px); }

        .fileira { display: flex; flex-wrap: wrap; gap: 15px; }
        .card-wrapper { position: relative; flex: 1 1 220px; max-width: 350px; }
        
        .card { 
            display: block; height: 140px; background-color: var(--card); background-size: cover; 
            background-position: center; border-radius: 8px; text-decoration: none; color: white; 
            transition: 0.4s; border: 2px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; 
        }
        .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }

        /* BOTÃO DO LÁPIS VOLTOU */
        .edit-banner-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7);
            color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; display: none; z-index: 10; align-items: center; justify-content: center;
        }
        .card-wrapper:hover .edit-banner-btn { display: flex; }
        .edit-banner-btn:hover { background: var(--primary); }

        .card-info { background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 100%); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; padding: 15px; text-transform: uppercase; text-shadow: 2px 2px 4px #000; }
        
        .skeleton { background: #222; height: 140px; border-radius: 8px; flex: 1 1 220px; max-width: 350px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .btn-icon { color: white; text-decoration: none; font-size: 20px; background: none; border: none; cursor: pointer; transition: 0.3s; padding: 5px; }
        .btn-icon:hover { color: var(--primary); }

        .footer { padding: 20px 4%; color: #666; font-size: 13px; text-align: center; border-top: 1px solid #333; margin-top: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-overlay" id="bgOverlay"></div>

    <div id="login-container">
        <h1 class="hero-title">NetLinks</h1>
        <div id="buttonDiv"></div>
    </div>

    <div id="painel-principal">
        <header class="header">
            <div class="datetime-container">
                <span id="clock">00:00</span>
                <span id="date">Carregando...</span>
            </div>
            
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar links..." onkeyup="filtrarBanners()">
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <button onclick="mudarFundo()" class="btn-icon" title="Mudar Fundo"><i class="fas fa-image"></i></button>
                <div id="userBadge"></div>
                <a href="settings.html" class="btn-icon" title="Configurações"><i class="fas fa-cog"></i></a>
                <button onclick="logout()" class="btn-icon" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main id="categorias-container">
            <div class="fileira"><div class="skeleton"></div><div class="skeleton"></div></div>
        </main>
    </div>

    <footer class="footer">
        &copy; 2026 <b>NetLinks</b>. Painel Sincronizado.
    </footer>

    <script>
        const CLIENT_ID = "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com";
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";

        function updateClock() {
            const n = new Date();
            document.getElementById('clock').textContent = n.toLocaleTimeString('pt-BR', { hour12: false });
            document.getElementById('date').textContent = n.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
        }
        setInterval(updateClock, 1000);

        function handleCredentialResponse(r) {
            const d = JSON.parse(atob(r.credential.split('.')[1]));
            localStorage.setItem("netlinks_user", d.email);
            localStorage.setItem("netlinks_name", d.name);
            localStorage.setItem("netlinks_pic", d.picture);
            location.reload();
        }

        window.onload = function () {
            updateClock();
            const e = localStorage.getItem("netlinks_user");
            if (e) {
                document.getElementById('painel-principal').style.display = 'block';
                document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('netlinks_pic')}" style="width:30px; border-radius:50%; border:1px solid var(--primary)">`;
                carregarDados(e);
            } else {
                document.getElementById('login-container').style.display = 'flex';
                google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
                google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "outline", size: "large", shape: "pill" });
            }
        };

        async function carregarDados(e) {
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(e)}`);
                const d = await res.json();
                
                if(d.fundo_tela && d.fundo_tela.trim() !== "") {
                    document.body.style.backgroundImage = `url('${d.fundo_tela}')`;
                    document.getElementById('bgOverlay').style.display = 'block';
                }
                renderizar(d);
            } catch (err) { console.error("Erro:", err); }
        }

        function renderizar(d) {
            const c = document.getElementById('categorias-container');
            c.innerHTML = "";
            d.categorias.forEach(cat => {
                const id = cat.toLowerCase().replace(/\s+/g, '-');
                c.innerHTML += `<div><h2 style="text-transform:uppercase; font-size:1.1rem; margin:30px 0 15px 0; border-left:4px solid var(--primary); padding-left:10px;">${cat}</h2><div class="fileira" id="container-${id}"></div></div>`;
            });
            d.banners.forEach((i, index) => {
                const id = i.categoria.toLowerCase().replace(/\s+/g, '-');
                const f = document.getElementById(`container-${id}`);
                if (f) {
                    const chaveBanner = btoa(i.nome + i.link);
                    const localImg = localStorage.getItem(`banner_img_${chaveBanner}`);
                    let img = localImg || i.imagem || "https://drive.google.com/thumbnail?id=1OyRgCJqj0SASvlxkbPBWxh8SYRYJJc2N&sz=w1000";
                    
                    if (!localImg && img.includes("drive.google.com")) {
                        const drvId = img.split('id=')[1] || img.split('/d/')[1].split('/')[0];
                        img = `https://drive.google.com/uc?id=${drvId}`;
                    }

                    f.innerHTML += `
                        <div class="card-wrapper">
                            <button class="edit-banner-btn" onclick="mudarImagemBanner('card-${index}', '${chaveBanner}')">
                                <i class="fas fa-pen"></i>
                            </button>
                            <a href="${i.link}" target="_blank" class="card" id="card-${index}" style="background-image: url('${img}');">
                                <div class="card-info">${i.nome}</div>
                            </a>
                        </div>`;
                }
            });
        }

        function mudarImagemBanner(idElemento, chaveBanner) {
            const url = prompt("Link da nova imagem para este banner:");
            if (url) {
                localStorage.setItem(`banner_img_${chaveBanner}`, url);
                document.getElementById(idElemento).style.backgroundImage = `url('${url}')`;
            }
        }

        async function mudarFundo() {
            const e = localStorage.getItem("netlinks_user");
            const u = prompt("Link da imagem de fundo:");
            if (u) {
                document.body.style.backgroundImage = `url('${u}')`;
                document.getElementById('bgOverlay').style.display = 'block';
                
                await fetch(urlApp, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "saveBackground", dono: e, fundo: u })
                });
            }
        }

        function filtrarBanners() {
            const t = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card-wrapper').forEach(w => {
                w.classList.toggle('hidden', !w.textContent.toLowerCase().includes(t));
            });
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
