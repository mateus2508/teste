<style>
    :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
    body { background-color: var(--bg); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
    
    #login-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); }
    .hero-title { font-size: 4rem; color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 5px; font-weight: 900; }

    #painel-principal { display: none; padding: 20px 4% 140px 4%; flex: 1; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }

    .categoria-titulo { font-size: 1.3rem; margin: 45px 0 20px 0; border-left: 6px solid var(--primary); padding-left: 15px; text-transform: uppercase; font-weight: bold; width: 100%; }
    
    .fileira { 
        display: flex; 
        flex-direction: row; 
        flex-wrap: wrap;    
        gap: 15px;          
        width: 100%;        
        justify-content: flex-start; 
    }

    .card { 
        flex: 1 1 220px;    
        max-width: 350px;   
        height: 140px; 
        background-color: var(--card); 
        background-size: cover; 
        background-position: center; 
        border-radius: 8px; 
        text-decoration: none; 
        color: white; 
        transition: 0.4s; 
        overflow: hidden; 
        border: 2px solid #333; /* Borda sutil para definir o card */
        display: block;     
    }

    .card:hover { transform: scale(1.05); border-color: #fff; z-index: 5; }

    /* EFEITO DE FUNDO MAIS SÓLIDO E TEXTO COM DESTAQUE */
    .card-info { 
        /* Gradiente de preto sólido para transparente, escurecendo a imagem */
        background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%); 
        width: 100%; 
        height: 100%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-weight: bold; 
        text-align: center; 
        padding: 15px; 
        box-sizing: border-box; 
        font-size: 1.1rem;
        text-transform: uppercase;
        
        /* BORDA NO TEXTO (CONTORNO) */
        text-shadow: 
            -1px -1px 0 #000,  
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000,
             2px 2px 5px rgba(0,0,0,0.8); /* Sombra suave para profundidade */
    }

    .card:hover .card-info { 
        background: rgba(0,0,0,0.2); /* Clareia um pouco ao passar o mouse */
    }

    .footer { background: #000; padding: 40px 4%; border-top: 1px solid #333; color: #777; font-size: 14px; margin-top: auto; }
</style>
