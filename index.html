    <style>
        /* --- ESTILOS GERAIS --- */
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 4%;
        }

        h1 {
            color: #E50914;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: left;
        }

        .categoria-titulo {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 35px 0 10px 0;
            color: #e5e5e5;
            border-left: 4px solid #E50914;
            padding-left: 12px;
        }

        /* --- GRID SEM ROLAGEM HORIZONTAL --- */
        .fileira {
            display: flex;
            flex-wrap: wrap; 
            gap: 15px;
            padding: 10px 0;
        }

        /* --- O CARD (DESIGN NETFLIX) --- */
        .card {
            flex: 1 1 calc(20% - 15px); 
            min-width: 200px;
            height: 125px;
            background-color: #2f2f2f;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            position: relative;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease, border 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: scale(1.05);
            z-index: 10;
            border: 2px solid white;
        }

        .card-info {
            background: rgba(0,0,0,0.6);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        .card:hover .card-info {
            background: rgba(229, 9, 20, 0.85);
        }

        @media (max-width: 600px) {
            .card {
                flex: 1 1 calc(45% - 10px);
            }
        }
    </style>
</head>
