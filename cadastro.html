<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Banner - NetLinks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #141414; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; }
        h2 { color: #E50914; text-align: center; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; background: #E50914; color: white; transition: 0.3s; }
        .btn:disabled { background: #555; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Cadastrar Banner</h2>
        <form id="formCadastro">
            <select id="categoria" required><option value="">Carregando categorias...</option></select>
            <input type="text" id="nome" placeholder="Nome do Sistema" required>
            <input type="text" id="imagem" placeholder="Link Imagem (Drive ou Web)">
            <input type="url" id="link" placeholder="Link do Site" required>
            <button type="submit" class="btn" id="btnSalvar">SALVAR BANNER</button>
        </form>
        <a href="settings.html" style="display:block; text-align:center; color:#aaa; margin-top:20px; text-decoration:none;">Cancelar</a>
    </div>
    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        const dono = localStorage.getItem("netlinks_user");

        async function carregar() {
            if (!dono) { window.location.href = "index.html"; return; }
            try {
                const res = await fetch(`${urlApp}?dono=${dono}`);
                const dados = await res.json();
                const s = document.getElementById('categoria');
                s.innerHTML = '<option value="">Selecione...</option>' + 
                              dados.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
            } catch (e) { console.error("Erro:", e); }
        }

        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const b = document.getElementById('btnSalvar');
            
            // Feedback Visual Imediato
            b.disabled = true; 
            b.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SALVANDO NO BANCO...';

            const d = { 
                action: "addBanner", 
                dono: dono, 
                categoria: document.getElementById('categoria').value, 
                nome: document.getElementById('nome').value, 
                imagem: document.getElementById('imagem').value, 
                link: document.getElementById('link').value 
            };

            try {
                await fetch(urlApp, { method: 'POST', body: JSON.stringify(d) });
                
                // Feedback de Sucesso
                b.style.backgroundColor = "#27ae60";
                b.innerHTML = '<i class="fas fa-check"></i> SALVO COM SUCESSO!';
                
                setTimeout(() => { window.location.href = "index.html"; }, 1000);
            } catch (error) {
                alert("Erro ao salvar.");
                b.disabled = false;
                b.innerHTML = 'SALVAR BANNER';
            }
        });

        window.onload = carregar;
    </script>
</body>
</html>
