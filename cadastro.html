<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Banner - NetLinks</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #E50914; text-align: center; margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #E50914; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; background: #E50914; color: white; }
        .btn:hover { background: #b20710; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-voltar { display: block; text-align: center; color: #aaa; text-decoration: none; margin-top: 20px; font-size: 14px; }
        #mensagem { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Cadastrar Novo Banner</h2>
        <form id="formCadastro">
            <label>Escolha a Categoria:</label>
            <select id="categoria" required>
                <option value="">Carregando categorias...</option>
            </select>

            <label>Nome do Sistema/Banner:</label>
            <input type="text" id="nome" placeholder="Ex: Portal RH" required>

            <label>Link da Imagem (Google Drive):</label>
            <input type="text" id="imagem" placeholder="Link direto da imagem" required>

            <label>Link de Destino (URL do Sistema):</label>
            <input type="url" id="link" placeholder="https://..." required>

            <button type="submit" class="btn" id="btnSalvar">SALVAR BANNER</button>
        </form>
        <div id="mensagem"></div>
        <a href="index.html" class="btn-voltar">Cancelar e Voltar</a>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";

        // 1. CARREGA AS CATEGORIAS DA PLANILHA NO SELECT
        async function carregarCategorias() {
            const select = document.getElementById('categoria');
            try {
                const res = await fetch(urlApp);
                const dados = await res.json();
                
                select.innerHTML = '<option value="">Selecione o segmento</option>';
                
                if (dados.categorias && dados.categorias.length > 0) {
                    dados.categorias.forEach(cat => {
                        if(cat && cat.trim() !== "") {
                            select.innerHTML += `<option value="${cat}">${cat.toUpperCase()}</option>`;
                        }
                    });
                } else {
                    select.innerHTML = '<option value="">Crie uma categoria primeiro!</option>';
                }
            } catch (e) {
                select.innerHTML = '<option value="">Erro ao carregar categorias</option>';
            }
        }

        // 2. ENVIA O FORMULÁRIO PARA A PLANILHA
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            const msg = document.getElementById('mensagem');

            const dados = {
                categoria: document.getElementById('categoria').value,
                nome: document.getElementById('nome').value,
                imagem: document.getElementById('imagem').value,
                link: document.getElementById('link').value
            };

            btn.disabled = true;
            btn.innerText = "ENVIANDO...";
            msg.innerText = "Salvando na planilha...";
            msg.style.color = "#fff";

            try {
                // Envio usando POST
                await fetch(urlApp, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(dados)
                });

                msg.innerText = "Sucesso! Banner cadastrado.";
                msg.style.color = "#27ae60";
                document.getElementById('formCadastro').reset();
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                msg.innerText = "Erro ao salvar. Tente novamente.";
                msg.style.color = "#E50914";
                btn.disabled = false;
                btn.innerText = "SALVAR BANNER";
            }
        });

        // Inicia carregando as categorias
        window.onload = carregarCategorias;
    </script>
</body>
</html>
