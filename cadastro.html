<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Banner - NetLinks</title>
    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #2f2f2f;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #E50914; text-align: center; margin-top: 0; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #444;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        .btn-salvar {
            background: #E50914;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-salvar:disabled { background: #555; }
        .btn-voltar {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            background: #444;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Novo Banner</h2>
        
        <div class="campo">
            <label>Segmento (Categoria):</label>
            <select id="categoria">
                <option value="sistemas">SISTEMAS</option>
                <option value="citr">CITR</option>
                <option value="cisl">CISL</option>
                <option value="pagamentos">PAGAMENTOS</option>
                <option value="materiais">MATERIAIS</option>
                <option value="gestao">GESTÃO DE EQUIPE</option>
            </select>
        </div>

        <div class="campo">
            <label>Nome do Sistema/Banner:</label>
            <input type="text" id="nome" placeholder="Ex: Voalle">
        </div>

        <div class="campo">
            <label>Link da Imagem (Google Drive):</label>
            <input type="text" id="linkDrive" placeholder="Cole o link de compartilhamento">
        </div>

        <div class="campo">
            <label>URL de Acesso (Link do Sistema):</label>
            <input type="url" id="urlDestino" placeholder="https://...">
        </div>

        <button class="btn-salvar" id="btnProsseguir" onclick="enviarDados()">PROSSEGUIR</button>
        <a href="index.html" class="btn-voltar">VOLTAR À PÁGINA INICIAL</a>

        <div id="status"></div>
    </div>

    <script>
        async function enviarDados() {
            const btn = document.getElementById('btnProsseguir');
            const status = document.getElementById('status');
            const linkDrive = document.getElementById('linkDrive').value;
            const nome = document.getElementById('nome').value;
            const linkSistema = document.getElementById('urlDestino').value;
            const categoria = document.getElementById('categoria').value;

            const regex = /\/d\/([a-zA-Z0-9_-]+)|id=([a-zA-Z0-9_-]+)/;
            const match = linkDrive.match(regex);

            if (!match || !nome || !linkSistema) {
                alert("Preencha todos os campos corretamente.");
                return;
            }

            const fileId = match[1] || match[2];
            const linkFinalImg = `https://drive.google.com/uc?export=view&id=${fileId}`;

            const urlApp = "https://script.google.com/macros/s/AKfycbzS04tpI2x7pSkWDDq-vVkZKk--yueuoK8f281O95Yojj94k4gqEMLFmQyiRJrliYXOkA/exec
";

            const dados = {
                categoria: categoria,
                nome: nome,
                imagem: linkFinalImg,
                link: linkSistema
            };

            btn.disabled = true;
            btn.innerText = "ENVIANDO...";
            status.style.display = "block";
            status.style.backgroundColor = "#444";
            status.innerText = "Salvando na planilha...";

            // Enviando via formulário oculto para evitar erros de CORS
            fetch(urlApp, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            }).then(() => {
                status.style.backgroundColor = "#27ae60";
                status.innerText = "Cadastrado com sucesso!";
                setTimeout(() => { window.location.href = "index.html"; }, 1500);
            }).catch(err => {
                alert("Erro ao salvar. Verifique sua conexão.");
                btn.disabled = false;
                btn.innerText = "PROSSEGUIR";
            });
        }
    </script>
</body>
</html>
