<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Banner - NetLinks</title>
    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #2f2f2f;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h2 { 
            color: #E50914; 
            margin-top: 0;
            text-align: center;
        }
        .campo { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #444;
            color: white;
            box-sizing: border-box;
        }
        .btn-salvar {
            background: #E50914;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        .btn-salvar:hover {
            background: #b20710;
        }
        /* BOTÃO VOLTAR AJUSTADO */
        .btn-voltar {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            background: #444; /* Cor cinza para diferenciar do salvar */
            padding: 12px;
            border-radius: 4px;
            transition: all 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-voltar:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Novo Banner</h2>
        
        <div class="campo">
            <label>Selecione a Categoria (Segmento):</label>
            <select id="categoria">
                <option value="sistemas">SISTEMAS</option>
                <option value="citr">CITR</option>
                <option value="cisl">CISL</option>
                <option value="pagamentos">PAGAMENTOS</option>
                <option value="materiais">MATERIAIS</option>
                <option value="gestao">GESTÃO DE EQUIPE</option>
            </select>
        </div>

        <div class="campo">
            <label>Nome do Link/Banner:</label>
            <input type="text" placeholder="Ex: Google Drive">
        </div>

        <div class="campo">
            <label>URL do Link:</label>
            <input type="url" placeholder="https://...">
        </div>

        <button class="btn-salvar">PROSSEGUIR</button>
        
        <a href="index.html" class="btn-voltar">VOLTAR À PÁGINA INICIAL</a>
    </div>

</body>
</html>
