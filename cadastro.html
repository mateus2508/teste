<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Banner - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #141414; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 12px; width: 400px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; background: #E50914; color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="color:#E50914; text-align:center;">Cadastrar Banner</h2>
        <form id="formCadastro">
            <select id="categoria" required><option value="">Carregando...</option></select>
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="text" id="imagem" placeholder="Link Imagem (Drive ou Web)">
            <input type="url" id="link" placeholder="Link do Site" required>
            <button type="submit" class="btn" id="btnSalvar">Salvar Banner</button>
        </form>
        <a href="settings.html" style="display:block; text-align:center; color:#aaa; margin-top:20px; text-decoration:none;">Cancelar</a>
    </div>
    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        const dono = localStorage.getItem("netlinks_user");
        async function carregar() {
            const res = await fetch(`${urlApp}?dono=${dono}`);
            const dados = await res.json();
            document.getElementById('categoria').innerHTML = '<option value="">Selecione...</option>' + dados.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
        }
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const b = document.getElementById('btnSalvar');
            b.disabled = true; b.innerHTML = 'Salvando...';
            const d = { action: "addBanner", dono: dono, categoria: document.getElementById('categoria').value, nome: document.getElementById('nome').value, imagem: document.getElementById('imagem').value, link: document.getElementById('link').value };
            await fetch(urlApp, { method: 'POST', body: JSON.stringify(d) });
            window.location.href = "index.html";
        });
        carregar();
    </script>
</body>
</html>
