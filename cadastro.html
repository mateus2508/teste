<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - NetLinks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; --green: #27ae60; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: var(--primary); text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        
        .guia-rapido { background: #1f1f1f; border-left: 4px solid var(--primary); padding: 15px; margin-bottom: 30px; border-radius: 4px; font-size: 14px; color: #ccc; line-height: 1.6; }
        
        .section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .config-card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        h2 { font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 15px; margin-top: 0; color: #fff; }
        label { display: block; margin: 15px 0 5px; font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; }
        
        input, select { width: 100%; padding: 12px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; outline: none; box-sizing: border-box; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary); }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .btn-add { background: var(--green); margin-bottom: 20px; }
        .btn-add:hover { background: #219150; }
        .btn-del { background: var(--primary); }
        .btn-del:hover { background: #b20710; }
        .btn-del:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }
        
        .btn-voltar { background: #444; width: 200px; margin: 40px auto; }
        .btn-voltar:hover { background: #555; }
        
        #status-msg { text-align: center; font-weight: bold; color: var(--green); margin-bottom: 15px; min-height: 20px; text-transform: uppercase; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel de Controle</h1>
        
        <div id="status-msg"></div>

        <div class="guia-rapido">
            <i class="fas fa-info-circle"></i> <b>Gestão de Conteúdo:</b><br>
            • Para criar links, você precisa ter pelo menos uma <b>Categoria</b> criada.<br>
            • Ao excluir uma categoria, <b>todos os links</b> dentro dela serão removidos permanentemente.
        </div>

        <div class="section-grid">
            <div class="config-card">
                <h2><i class="fas fa-list"></i> Categorias</h2>
                <label>Criar Nova:</label>
                <input type="text" id="novaCat" placeholder="Ex: Sistemas, Bancos, Social...">
                <button class="btn btn-add" id="btnCriarCat" onclick="criarCategoria()">
                    <i class="fas fa-plus"></i> CRIAR CATEGORIA
                </button>
                
                <hr style="border:0; border-top:1px solid #444; margin:25px 0;">
                
                <label>Excluir Categoria:</label>
                <select id="selectDelCat">
                    <option value="">Carregando categorias...</option>
                </select>
                <button class="btn btn-del" id="btnDelCat" onclick="deletarCat()">
                    <i class="fas fa-trash-alt"></i> EXCLUIR CATEGORIA
                </button>
            </div>

            <div class="config-card">
                <h2><i class="fas fa-link"></i> Links (Banners)</h2>
                <a href="cadastro.html" class="btn btn-add">
                    <i class="fas fa-external-link-alt"></i> ADICIONAR NOVO LINK
                </a>
                
                <hr style="border:0; border-top:1px solid #444; margin:25px 0;">
                
                <label>Filtrar por Categoria:</label>
                <select id="selCatB" onchange="atualizarListaBanners()">
                    <option value="">Selecione uma categoria...</option>
                </select>
                
                <label>Selecionar Link para Remover:</label>
                <select id="selBanner" disabled>
                    <option value="">Escolha a categoria primeiro</option>
                </select>
                <button class="btn btn-del" id="btnDelBanner" onclick="deletarBanner()" disabled>
                    <i class="fas fa-eraser"></i> EXCLUIR LINK SELECIONADO
                </button>
            </div>
        </div>

        <a href="index.html" class="btn btn-voltar"><i class="fas fa-arrow-left"></i> VOLTAR À HOME</a>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        const dono = localStorage.getItem("netlinks_user");
        let dadosLocais = { categorias: [], banners: [] };

        if(!dono) window.location.href = "index.html";

        async function carregar() {
            try {
                const res = await fetch(`${urlApp}?dono=${dono}`);
                dadosLocais = await res.json();
                
                const opts = '<option value="">Selecione...</option>' + 
                             dadosLocais.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
                
                document.getElementById('selectDelCat').innerHTML = opts;
                document.getElementById('selCatB').innerHTML = opts;
            } catch (e) { 
                console.error("Erro ao carregar:", e);
                document.getElementById('status-msg').style.color = "red";
                document.getElementById('status-msg').innerText = "Erro ao conectar com o banco de dados.";
            }
        }

        function atualizarListaBanners() {
            const cat = document.getElementById('selCatB').value;
            const selB = document.getElementById('selBanner');
            const btn = document.getElementById('btnDelBanner');
            
            if(!cat) { 
                selB.disabled = true; 
                btn.disabled = true; 
                selB.innerHTML = '<option value="">Escolha a categoria primeiro</option>';
                return; 
            }
            
            const bans = dadosLocais.banners.filter(b => b.categoria === cat);
            
            if(bans.length === 0) {
                selB.innerHTML = '<option value="">Nenhum link nesta categoria</option>';
                selB.disabled = true;
                btn.disabled = true;
            } else {
                selB.innerHTML = '<option value="">Selecione o link...</option>' + 
                                 bans.map(b => `<option value="${b.nome}">${b.nome}</option>`).join('');
                selB.disabled = false;
                btn.disabled = true; // Habilita apenas quando selecionar o banner
            }
        }

        document.getElementById('selBanner').addEventListener('change', function() {
            document.getElementById('btnDelBanner').disabled = !this.value;
        });

        async function criarCategoria() {
            const n = document.getElementById('novaCat').value.trim();
            if(!n) return;
            statusLoading('btnCriarCat', 'Criando categoria...');
            await fetch(urlApp, { method:'POST', body: JSON.stringify({ action: "addCategory", nome: n, dono: dono }) });
            location.reload();
        }

        async function deletarCat() {
            const v = document.getElementById('selectDelCat').value;
            if(v && confirm(`ATENÇÃO: Isso excluirá a categoria "${v}" e TODOS os links dentro dela. Confirma?`)) {
                statusLoading('btnDelCat', 'Excluindo categoria e links...');
                await fetch(urlApp, { method:'POST', body: JSON.stringify({ action: "deleteCategory", nome: v, dono: dono }) });
                location.reload();
            }
        }

        async function deletarBanner() {
            const c = document.getElementById('selCatB').value;
            const n = document.getElementById('selBanner').value;
            if(confirm(`Deseja excluir o link "${n}"?`)) {
                statusLoading('btnDelBanner', 'Removendo link...');
                await fetch(urlApp, { method:'POST', body: JSON.stringify({ action: "delete", categoria: c, nome: n, dono: dono }) });
                location.reload();
            }
        }

        function statusLoading(id, msg) {
            const b = document.getElementById(id); 
            b.disabled = true; 
            b.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AGUARDE...';
            document.getElementById('status-msg').innerText = msg;
        }

        carregar();
    </script>
</body>
</html>
