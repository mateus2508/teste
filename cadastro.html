<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Banner - NetLinks</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #E50914; text-align: center; margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; background: #E50914; color: white; }
        #mensagem { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Novo Banner</h2>
        <form id="formCadastro">
            <label>Categoria:</label>
            <select id="categoria" required><option value="">Carregando...</option></select>
            <label>Nome do Sistema:</label>
            <input type="text" id="nome" required>
            <label>Link da Imagem (Opcional):</label>
            <input type="text" id="imagem" placeholder="Google Drive ou Link Web">
            <label>Link de Destino:</label>
            <input type="url" id="link" required>
            <button type="submit" class="btn" id="btnSalvar">SALVAR</button>
        </form>
        <div id="mensagem"></div>
        <a href="settings.html" style="display:block; text-align:center; color:#aaa; margin-top:20px; text-decoration:none;">Cancelar</a>
    </div>
    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        async function carregar() {
            const res = await fetch(urlApp);
            const dados = await res.json();
            const sel = document.getElementById('categoria');
            sel.innerHTML = '<option value="">Selecione...</option>' + dados.categorias.filter(c => c).map(c => `<option value="${c}">${c.toUpperCase()}</option>`).join('');
        }
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.disabled = true; btn.innerText = "Salvando...";
            const dados = { categoria: document.getElementById('categoria').value, nome: document.getElementById('nome').value, imagem: document.getElementById('imagem').value, link: document.getElementById('link').value };
            await fetch(urlApp, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) });
            document.getElementById('mensagem').innerText = "Sucesso!";
            setTimeout(() => window.location.href = "settings.html", 1200);
        });
        window.onload = carregar;
    </script>
</body>
</html>
