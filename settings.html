<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Configurações - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; --green: #27ae60; }
        body { background-color: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .config-card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #444; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; margin-top: 10px; }
        .btn-add { background: var(--green); }
        .btn-del { background: var(--primary); }
        .btn-voltar { background: #444; display: block; text-align: center; text-decoration: none; width: 200px; margin: 20px auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color:var(--primary); text-align:center;">Configurações</h1>
        <div class="config-card">
            <h2>Categorias</h2>
            <input type="text" id="novaCat" placeholder="Nova Categoria">
            <button class="btn btn-add" onclick="criarCategoria()">Criar Categoria</button>
            <hr>
            <select id="selectDelCat"><option>Carregando...</option></select>
            <button class="btn btn-del" onclick="deletarCat()">Excluir Categoria</button>
        </div>
        <div class="config-card">
            <h2>Banners</h2>
            <a href="cadastro.html" class="btn btn-add" style="display:block; text-align:center; text-decoration:none;">Novo Banner</a>
        </div>
        <a href="index.html" class="btn btn-voltar">Voltar</a>
    </div>
    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        const dono = localStorage.getItem("netlinks_user");
        async function carregar() {
            const res = await fetch(`${urlApp}?dono=${dono}`);
            const dados = await res.json();
            document.getElementById('selectDelCat').innerHTML = '<option value="">Selecione...</option>' + dados.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
        }
        async function criarCategoria() {
            const n = document.getElementById('novaCat').value;
            await fetch(urlApp, { method:'POST', body: JSON.stringify({ action: "addCategory", nome: n, dono: dono }) });
            location.reload();
        }
        async function deletarCat() {
            const v = document.getElementById('selectDelCat').value;
            if(confirm(`Excluir ${v}?`)) {
                await fetch(urlApp, { method:'POST', body: JSON.stringify({ action: "deleteCategory", nome: v, dono: dono }) });
                location.reload();
            }
        }
        carregar();
    </script>
</body>
</html>
