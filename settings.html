<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; --green: #27ae60; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--primary); text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }

        /* BOTÕES ESTILO IMAGEM */
        .accordion-btn {
            width: 100%; padding: 20px; margin-bottom: 10px; border-radius: 15px; border: 3px solid #000;
            font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 15px; transition: 0.3s; color: white;
        }
        .btn-verde { background-color: var(--green); }
        .btn-vermelho { background-color: var(--primary); }
        .accordion-btn:hover { opacity: 0.9; transform: scale(1.01); }

        /* PAINÉIS RETRÁTEIS */
        .panel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #252525; border-radius: 0 0 15px 15px; margin-top: -15px; margin-bottom: 15px; padding: 0 20px; }
        .panel-content { padding: 25px 0; }

        label { display: block; margin-bottom: 8px; font-size: 12px; color: #888; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #444; color: white; border: 1px solid #555; outline: none; box-sizing: border-box; margin-bottom: 15px; }
        
        .action-submit { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; background: #444; transition: 0.3s; }
        .action-submit:hover { background: #555; border: 1px solid white; }

        .btn-voltar { display: block; width: 180px; margin: 40px auto; padding: 12px; background: #333; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; }
        #status-msg { text-align: center; font-weight: bold; color: orange; margin-bottom: 15px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Painel NetLinks</h1>
        <div id="status-msg"></div>

        <button class="accordion-btn btn-verde" onclick="togglePanel('panel1')">
            <i class="fas fa-folder-plus"></i> Criar Categoria
        </button>
        <div id="panel1" class="panel">
            <div class="panel-content">
                <label>Nome do Novo Grupo:</label>
                <input type="text" id="novaCat" placeholder="Ex: Bancos, Ferramentas...">
                <button class="action-submit" onclick="criarCategoria()">SALVAR CATEGORIA</button>
            </div>
        </div>

        <button class="accordion-btn btn-verde" onclick="togglePanel('panelBanner')">
            <i class="fas fa-plus-circle"></i> Criar Banner - Link
        </button>
        <div id="panelBanner" class="panel">
            <div class="panel-content">
                <label>Grupo (Categoria):</label>
                <select id="cadCatBanner"><option value="">Carregando...</option></select>
                <label>Nome do Link:</label>
                <input type="text" id="cadNomeBanner" placeholder="Ex: Gmail">
                <label>Link do Site:</label>
                <input type="text" id="cadUrlBanner" placeholder="https://...">
                <button class="action-submit" onclick="criarBanner()">SALVAR LINK</button>
            </div>
        </div>

        <button class="accordion-btn btn-vermelho" onclick="togglePanel('panel2')">
            <i class="fas fa-folder-minus"></i> Excluir Categoria
        </button>
        <div id="panel2" class="panel">
            <div class="panel-content">
                <label>Selecione a Categoria para apagar:</label>
                <select id="selectDelCat"><option value="">Carregando...</option></select>
                <button class="action-submit" onclick="deletarCat()" style="color: var(--primary);">EXCLUIR TUDO DESTA CATEGORIA</button>
            </div>
        </div>

        <button class="accordion-btn btn-vermelho" onclick="togglePanel('panel3')">
            <i class="fas fa-eraser"></i> Excluir Banner Link
        </button>
        <div id="panel3" class="panel">
            <div class="panel-content">
                <label>1. Filtrar Categoria:</label>
                <select id="selCatB" onchange="atualizarListaBanners()">
                    <option value="">Selecione...</option>
                </select>
                <label>2. Escolher Link para Remover:</label>
                <select id="selBanner" disabled><option value="">Selecione a categoria acima</option></select>
                <button class="action-submit" id="btnDelBanner" onclick="deletarBanner()" disabled style="color: var(--primary);">REMOVER APENAS ESTE LINK</button>
            </div>
        </div>

        <a href="index.html" class="btn-voltar">VOLTAR AO PAINEL</a>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        const dono = localStorage.getItem("netlinks_user");
        let dadosLocais = { categorias: [], banners: [] };

        function togglePanel(id) {
            const panel = document.getElementById(id);
            const isOpened = panel.style.maxHeight;
            document.querySelectorAll('.panel').forEach(p => p.style.maxHeight = null);
            if (!isOpened) { panel.style.maxHeight = panel.scrollHeight + "px"; }
        }

        async function carregar() {
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(dono)}`);
                dadosLocais = await res.json();
                const opts = '<option value="">Selecione...</option>' + 
                             dadosLocais.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
                document.getElementById('selectDelCat').innerHTML = opts;
                document.getElementById('selCatB').innerHTML = opts;
                document.getElementById('cadCatBanner').innerHTML = opts;
            } catch (e) { msg("Erro ao sincronizar."); }
        }

        function atualizarListaBanners() {
            const cat = document.getElementById('selCatB').value;
            const selB = document.getElementById('selBanner');
            const btn = document.getElementById('btnDelBanner');
            if(!cat) { selB.disabled = true; btn.disabled = true; return; }
            const bans = dadosLocais.banners.filter(b => b.categoria === cat);
            selB.innerHTML = bans.length ? '<option value="">Selecione...</option>' + bans.map(b => `<option value="${b.nome}">${b.nome}</option>`).join('') : '<option>Vazio</option>';
            selB.disabled = !bans.length;
        }

        document.getElementById('selBanner').onchange = function() {
            document.getElementById('btnDelBanner').disabled = !this.value;
        };

        async function criarCategoria() {
            const n = document.getElementById('novaCat').value.trim();
            if(!n) return;
            msg("Salvando Categoria...");
            await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "addCategory", nome: n, dono: dono }) });
            setTimeout(() => location.reload(), 1200);
        }

        async function criarBanner() {
            const cat = document.getElementById('cadCatBanner').value;
            const nome = document.getElementById('cadNomeBanner').value.trim();
            const url = document.getElementById('cadUrlBanner').value.trim();
            if(!cat || !nome || !url) { alert("Preencha os campos obrigatórios!"); return; }
            msg("Salvando Link...");
            // Enviamos imagem vazia já que o campo foi removido
            await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "addBanner", dono: dono, categoria: cat, nome: nome, imagem: "", link: url }) });
            setTimeout(() => location.reload(), 1200);
        }

        async function deletarCat() {
            const v = document.getElementById('selectDelCat').value;
            if(v && confirm(`Excluir grupo "${v}"?`)) {
                msg("Excluindo...");
                await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteCategory", nome: v, dono: dono }) });
                setTimeout(() => location.reload(), 1200);
            }
        }

        async function deletarBanner() {
            const c = document.getElementById('selCatB').value;
            const n = document.getElementById('selBanner').value;
            if(confirm(`Remover "${n}"?`)) {
                msg("Removendo...");
                await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", categoria: c, nome: n, dono: dono }) });
                setTimeout(() => location.reload(), 1200);
            }
        }

        function msg(t) { document.getElementById('status-msg').innerText = t; }
        carregar();
    </script>
</body>
</html>
