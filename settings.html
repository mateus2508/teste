<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; --green: #27ae60; --text: #ffffff; }
        
        body { 
            background: radial-gradient(circle at center, #2b0505 0%, #141414 100%);
            background-attachment: fixed;
            color: var(--text); 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding: 10px 4% 20px 4%; background: rgba(0,0,0,0.5); }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #444; }
        .user-badge img { width: 28px; border-radius: 50%; border: 1px solid var(--primary); }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        .accordion-btn {
            width: 100%; padding: 20px; margin-bottom: 10px; border-radius: 15px; border: 3px solid #000;
            font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 15px; transition: 0.3s; color: white;
        }
        .btn-verde { background-color: var(--green); }
        .btn-vermelho { background-color: var(--primary); }
        .accordion-btn:hover { opacity: 0.9; transform: scale(1.01); }

        .content { display: none; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 0 0 15px 15px; margin-top: -15px; margin-bottom: 20px; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 15px; background: var(--green); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div id="userBadge" class="user-badge"></div>
    </header>

    <div class="container">
        <button class="accordion-btn btn-verde" onclick="toggle('form-link')">
            <i class="fas fa-plus"></i> Novo Link
        </button>
        <div id="form-link" class="content">
            <input type="text" id="link-nome" placeholder="Nome do Site">
            <input type="text" id="link-url" placeholder="URL (https://...)">
            <select id="link-cat"><option value="">Selecione o Grupo</option></select>
            <button class="save-btn" onclick="salvarLink()">SALVAR LINK</button>
        </div>

        <button class="accordion-btn btn-verde" onclick="toggle('form-cat')">
            <i class="fas fa-folder-plus"></i> Novo Grupo
        </button>
        <div id="form-cat" class="content">
            <input type="text" id="cat-nome" placeholder="Nome do Novo Grupo">
            <button class="save-btn" onclick="salvarCategoria()">CRIAR GRUPO</button>
        </div>

        <button class="accordion-btn btn-vermelho" onclick="toggle('form-del')">
            <i class="fas fa-trash-alt"></i> Excluir Dados
        </button>
        <div id="form-del" class="content">
            <p style="font-size: 13px; color: #aaa;">Selecione o que deseja remover:</p>
            <select id="del-cat" onchange="carregarLinksParaDeletar()"><option value="">Selecione o Grupo...</option></select>
            <button class="save-btn" style="background: #666; margin-bottom: 20px;" onclick="deletarCategoria()">EXCLUIR GRUPO INTEIRO</button>
            
            <select id="del-link" style="display:none;"><option value="">Selecione o Link...</option></select>
            <button id="btn-del-link" class="save-btn" style="background: var(--primary); display:none;" onclick="deletarLink()">EXCLUIR LINK SELECIONADO</button>
        </div>
    </div>

    <script>
        // URL DA NOVA IMPLANTAÇÃO
        const urlApp = "https://script.google.com/macros/s/AKfycbxyp6Fw6RM8R73KsWjEKj1eHF4djr5HbLja_NwV4-9055TvL1QOPK-PhOtqce10mHHBag/exec";
        const dono = localStorage.getItem("netlinks_user");

        function toggle(id) {
            const el = document.getElementById(id);
            const isVisible = el.style.display === "block";
            document.querySelectorAll('.content').forEach(c => c.style.display = "none");
            el.style.display = isVisible ? "none" : "block";
            if(!isVisible && id !== 'form-cat') atualizarSelects();
        }

        window.onload = function() {
            if(!dono) window.location.href = "index.html";
            document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('netlinks_pic')}"> <span>${localStorage.getItem('netlinks_name')}</span>`;
            atualizarSelects();
        };

        async function atualizarSelects() {
            try {
                const r = await fetch(`${urlApp}?dono=${encodeURIComponent(dono)}`);
                const d = await r.json();
                const selects = ['link-cat', 'del-cat'];
                selects.forEach(s => {
                    const el = document.getElementById(s);
                    el.innerHTML = '<option value="">Selecione o Grupo...</option>' + 
                                   d.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
                });
            } catch (err) { console.error("Erro ao carregar selects:", err); }
        }

        async function salvarLink() {
            const p = {
                action: "addLink",
                dono: dono,
                nome: document.getElementById('link-nome').value,
                link: document.getElementById('link-url').value,
                categoria: document.getElementById('link-cat').value
            };
            enviar(p);
        }

        async function salvarCategoria() {
            const p = { action: "addCat", dono: dono, categoria: document.getElementById('cat-nome').value };
            enviar(p);
        }

        async function carregarLinksParaDeletar() {
            const cat = document.getElementById('del-cat').value;
            const linkSelect = document.getElementById('del-link');
            const btnDel = document.getElementById('btn-del-link');
            
            if (!cat) {
                linkSelect.style.display = "none";
                btnDel.style.display = "none";
                return;
            }

            const r = await fetch(`${urlApp}?dono=${encodeURIComponent(dono)}`);
            const d = await r.json();
            const linksFiltrados = d.banners.filter(b => b.categoria === cat);

            if (linksFiltrados.length > 0) {
                linkSelect.innerHTML = '<option value="">Selecione o Link...</option>' + 
                                       linksFiltrados.map(l => `<option value="${l.nome}">${l.nome}</option>`).join('');
                linkSelect.style.display = "block";
                btnDel.style.display = "block";
            } else {
                linkSelect.style.display = "none";
                btnDel.style.display = "none";
            }
        }

        async function deletarCategoria() {
            if(confirm("Tem certeza? Isso apagará o grupo e todos os links dele!")) {
                enviar({ action: "delCat", dono: dono, categoria: document.getElementById('del-cat').value });
            }
        }

        async function deletarLink() {
            if(confirm("Deseja excluir este link?")) {
                enviar({ action: "delLink", dono: dono, nome: document.getElementById('del-link').value });
            }
        }

        async function enviar(p) {
            try {
                await fetch(urlApp, { method: "POST", body: JSON.stringify(p) });
                alert("Operação realizada!");
                location.reload();
            } catch (err) { alert("Erro ao salvar."); }
        }
    </script>
</body>
</html>
