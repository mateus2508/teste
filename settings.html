<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --green: #27ae60; --text: #ffffff; }
        body { background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); background-attachment: fixed; color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding: 10px 4% 20px 4%; background: rgba(0,0,0,0.5); }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #444; }
        .user-badge img { width: 28px; border-radius: 50%; border: 1px solid var(--primary); }
        .container { max-width: 800px; margin: 0 auto; padding: 20px 20px 100px 20px; }
        .home-btn { display: block; width: 100%; padding: 15px; background: #333; color: white; text-align: center; text-decoration: none; border-radius: 15px; margin-bottom: 20px; font-weight: bold; border: 2px solid #444; box-sizing: border-box; }
        .accordion-btn { width: 100%; padding: 20px; margin-bottom: 10px; border-radius: 15px; border: 3px solid #000; font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 15px; transition: 0.3s; color: white; }
        .btn-verde { background-color: var(--green); }
        .btn-azul { background-color: #2980b9; } /* Nova cor para personalizar */
        .btn-vermelho { background-color: var(--primary); }
        .content { display: none; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 0 0 15px 15px; margin-top: -15px; margin-bottom: 20px; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; font-size: 16px; }
        input[type="color"] { height: 50px; cursor: pointer; padding: 5px; }
        .save-btn { width: 100%; padding: 15px; background: var(--green); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; text-transform: uppercase; }
        .save-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div id="userBadge" class="user-badge"></div>
    </header>
    <div class="container">
        <a href="index.html" class="home-btn"><i class="fas fa-home"></i> VOLTAR AO PAINEL</a>
        
        <button class="accordion-btn btn-verde" onclick="toggle('form-cat')"><i class="fas fa-folder-plus"></i> Nova Categoria</button>
        <div id="form-cat" class="content">
            <input type="text" id="cat-nome" placeholder="Nome da Nova Categoria">
            <p style="margin: 10px 0 5px 0; color: #aaa; font-size: 14px;">Cor de destaque da categoria:</p>
            <input type="color" id="cat-cor" value="#E50914">
            <button class="save-btn" onclick="salvarCategoria(this)">CRIAR CATEGORIA</button>
        </div>

        <button class="accordion-btn btn-verde" onclick="toggle('form-link')"><i class="fas fa-plus"></i> Novo Atalho</button>
        <div id="form-link" class="content">
            <input type="text" id="link-nome" placeholder="Nome do Atalho">
            <input type="text" id="link-url" placeholder="URL (https://...)">
            <select id="link-cat"><option value="">Selecione a Categoria</option></select>
            <button class="save-btn" onclick="salvarLink(this)">SALVAR ATALHO</button>
        </div>

        <button class="accordion-btn btn-azul" onclick="toggle('form-color')"><i class="fas fa-palette"></i> Personalizar Cores</button>
        <div id="form-color" class="content">
            <p style="margin: 0 0 5px 0; color: #aaa; font-size: 14px;">Selecione a Categoria:</p>
            <select id="color-cat" onchange="carregarCorAtual()"><option value="">Carregando...</option></select>
            <p style="margin: 10px 0 5px 0; color: #aaa; font-size: 14px;">Nova cor de destaque:</p>
            <input type="color" id="color-hex" value="#E50914">
            <button class="save-btn" style="background: #2980b9;" onclick="salvarNovaCor(this)">ATUALIZAR COR</button>
        </div>

        <button class="accordion-btn btn-vermelho" onclick="toggle('form-del')"><i class="fas fa-trash-alt"></i> Excluir Atalhos/Categorias</button>
        <div id="form-del" class="content">
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 5px;">Excluir um Atalho específico:</p>
            <select id="del-link"><option value="">Carregando atalhos...</option></select>
            <button class="save-btn" style="background: #888; margin-bottom: 20px;" onclick="deletarLink(this)">EXCLUIR ATALHO SELECIONADO</button>
            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 5px;">Excluir Categoria Inteira:</p>
            <select id="del-cat"><option value="">Selecione a Categoria...</option></select>
            <button class="save-btn" style="background: var(--primary);" onclick="deletarCategoria(this)">EXCLUIR CATEGORIA INTEIRA</button>
        </div>
    </div>
    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxyp6Fw6RM8R73KsWjEKj1eHF4djr5HbLja_NwV4-9055TvL1QOPK-PhOtqce10mHHBag/exec";
        const dono = localStorage.getItem("netlinks_user");
        let cacheBanners = [];
        let cacheCategorias = []; // Guardará objetos {nome, cor}

        function toggle(id) {
            const el = document.getElementById(id);
            const isVisible = (el.style.display === "block");
            document.querySelectorAll('.content').forEach(c => c.style.display = "none");
            if (!isVisible) { el.style.display = "block"; }
        }

        window.onload = function() {
            if(!dono) window.location.href = "index.html";
            document.getElementById('userBadge').innerHTML = `<img src="${localStorage.getItem('netlinks_pic')}"> <span>${localStorage.getItem('netlinks_name')}</span>`;
            carregarDadosConfig();
        };

        async function carregarDadosConfig() {
            try {
                const r = await fetch(`${urlApp}?dono=${encodeURIComponent(dono)}`);
                const d = await r.json();
                cacheBanners = d.banners;
                cacheCategorias = d.categorias; // d.categorias agora é array de objetos

                // Preencher selects de Categoria
                const opsCat = '<option value="">Selecione a Categoria...</option>' + d.categorias.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
                document.getElementById('link-cat').innerHTML = opsCat;
                document.getElementById('del-cat').innerHTML = opsCat;
                document.getElementById('color-cat').innerHTML = opsCat; // Select da nova aba

                // Preencher select de Atalhos para excluir
                const opsLink = '<option value="">Selecione o Atalho para remover...</option>' + d.banners.map((b, idx) => `<option value="${idx}">${b.nome} (${b.categoria})</option>`).join('');
                document.getElementById('del-link').innerHTML = opsLink;
            } catch (e) { console.error("Erro", e); }
        }

        // Nova função para mostrar a cor atual ao selecionar a categoria na aba de cores
        function carregarCorAtual() {
            const nomeCat = document.getElementById('color-cat').value;
            if(!nomeCat) return;
            const catObj = cacheCategorias.find(c => c.nome === nomeCat);
            if(catObj) {
                document.getElementById('color-hex').value = catObj.cor;
            }
        }

        async function enviar(payload, btn, msg) {
            btn.disabled = true;
            const textoOriginal = btn.innerText;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                const r = await fetch(urlApp, { method: "POST", body: JSON.stringify(payload) });
                const res = await r.json();
                if(res.result === "success") {
                    alert(msg);
                    location.reload();
                } else { throw new Error(); }
            } catch (e) {
                alert("Erro. Tente novamente.");
                btn.disabled = false;
                btn.innerText = textoOriginal;
            }
        }

        function salvarLink(btn) {
            const nome = document.getElementById('link-nome').value;
            const link = document.getElementById('link-url').value;
            const cat = document.getElementById('link-cat').value;
            if(!nome || !link || !cat) return alert("Preencha tudo!");
            enviar({ action: "addLink", dono: dono, nome: nome, link: link, categoria: cat }, btn, "Atalho salvo!");
        }

        function salvarCategoria(btn) {
            const cat = document.getElementById('cat-nome').value;
            const cor = document.getElementById('cat-cor').value; // Pega cor do seletor
            if(!cat) return alert("Digite o nome!");
            enviar({ action: "addCat", dono: dono, categoria: cat, cor: cor }, btn, "Categoria criada!");
        }

        // Nova função para salvar apenas a alteração de cor
        function salvarNovaCor(btn) {
            const cat = document.getElementById('color-cat').value;
            const cor = document.getElementById('color-hex').value;
            if(!cat) return alert("Selecione a categoria!");
            enviar({ action: "updateCatColor", dono: dono, categoria: cat, cor: cor }, btn, "Cor atualizada!");
        }

        function deletarLink(btn) {
            const idx = document.getElementById('del-link').value;
            if(idx === "" || !confirm("Excluir atalho?")) return;
            const atalho = cacheBanners[idx];
            enviar({ action: "delLink", dono: dono, nome: atalho.nome, link: atalho.link }, btn, "Atalho removido!");
        }

        function deletarCategoria(btn) {
            const cat = document.getElementById('del-cat').value;
            if(cat && confirm("Excluir categoria e tudo dentro dela?")) {
                enviar({ action: "delCat", dono: dono, categoria: cat }, btn, "Categoria removida!");
            }
        }
    </script>
</body>
</html>
