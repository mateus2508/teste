<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #E50914; 
            --bg: #141414; 
            --card: #2f2f2f; 
            --green: #27ae60; 
            --text: #ffffff; 
        }

        /* FUNDO PADRONIZADO PARA TODAS AS PÁGINAS */
        body { 
            background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); /* Mesmo fundo da Login/Index */
            background-attachment: fixed; /* Mantém o fundo fixo ao rolar */
            color: var(--text); 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
        }
        
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Cabeçalho Sincronizado */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            border-bottom: 1px solid #333; 
            padding: 10px 4% 20px 4%; 
            background: rgba(0,0,0,0.5); /* Leve transparência para destacar do fundo */
        }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #444; }
        .user-badge img { width: 28px; border-radius: 50%; border: 1px solid var(--primary); }

        /* Botões Estilo Imagem (Borda Grossa e Arredondada) */
        .accordion-btn {
            width: 100%; padding: 20px; margin-bottom: 10px; border-radius: 15px; border: 3px solid #000;
            font-size: 18px; font-weight: bold; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 15px; transition: 0.3s; color: white;
        }
        .btn-verde { background-color: var(--green); }
        .btn-vermelho { background-color: var(--primary); }
        .accordion-btn:hover { opacity: 0.9; transform: scale(1.01); }

        /* Painéis Retráteis */
        .panel { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.3s ease-out; 
            background: rgba(37, 37, 37, 0.95); /* Leve transparência */
            border-radius: 0 0 15px 15px; 
            margin-top: -15px; 
            margin-bottom: 15px; 
            padding: 0 20px; 
        }
        .panel-content { padding: 25px 0; }

        label { display: block; margin-bottom: 8px; font-size: 12px; color: #aaa; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #333; color: white; border: 1px solid #555; outline: none; box-sizing: border-box; margin-bottom: 15px; }
        
        .action-submit { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; background: #444; transition: 0.3s; text-transform: uppercase; }
        .action-submit:hover:not(:disabled) { background: #555; border: 1px solid white; }
        .action-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-voltar { display: block; width: 180px; margin: 40px auto; padding: 12px; background: #333; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; border: 1px solid #444; }
        #status-msg { text-align: center; font-weight: bold; color: #f1c40f; margin-bottom: 15px; min-height: 20px; text-transform: uppercase; font-size: 14px; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div id="userBadge" class="user-badge"></div>
    </header>

    <div class="container">
        <div id="status-msg"></div>

        <button class="accordion-btn btn-verde" onclick="togglePanel('panel1')">
            <i class="fas fa-folder-plus"></i> Criar Categoria
        </button>
        <div id="panel1" class="panel">
            <div class="panel-content">
                <label>Nome do Grupo:</label>
                <input type="text" id="novaCat" placeholder="Ex: Sistemas, Bancos...">
                <button class="action-submit" id="btnSaveCat" onclick="criarCategoria()">SALVAR CATEGORIA</button>
            </div>
        </div>

        <button class="accordion-btn btn-verde" onclick="togglePanel('panelBanner')">
            <i class="fas fa-plus-circle"></i> Criar Banner - Link
        </button>
        <div id="panelBanner" class="panel">
            <div class="panel-content">
                <label>Categoria:</label>
                <select id="cadCatBanner"><option value="">Carregando...</option></select>
                <label>Nome do Link:</label>
                <input type="text" id="cadNomeBanner" placeholder="Ex: Google Drive">
                <label>URL do Site:</label>
                <input type="text" id="cadUrlBanner" placeholder="https://...">
                <button class="action-submit" id="btnSaveBanner" onclick="criarBanner()">SALVAR LINK</button>
            </div>
        </div>

        <button class="accordion-btn btn-vermelho" onclick="togglePanel('panel2')">
            <i class="fas fa-folder-minus"></i> Excluir Categoria
        </button>
        <div id="panel2" class="panel">
            <div class="panel-content">
                <label>Escolha o Grupo para Apagar:</label>
                <select id="selectDelCat"><option value="">Carregando...</option></select>
                <button class="action-submit" id="btnDelCat" onclick="deletarCat()" style="color: #ff4d4d;">APAGAR TUDO</button>
            </div>
        </div>

        <button class="accordion-btn btn-vermelho" onclick="togglePanel('panel3')">
            <i class="fas fa-eraser"></i> Excluir Banner Link
        </button>
        <div id="panel3" class="panel">
            <div class="panel-content">
                <label>1. Filtrar Categoria:</label>
                <select id="selCatB" onchange="atualizarListaBanners()">
                    <option value="">Selecione...</option>
                </select>
                <label>2. Escolher Link:</label>
                <select id="selBanner" disabled><option value="">Escolha a categoria</option></select>
                <button class="action-submit" id="btnDelBanner" onclick="deletarBanner()" disabled style="color: #ff4d4d;">EXCLUIR LINK</button>
            </div>
        </div>

        <a href="index.html" class="btn-voltar">VOLTAR À HOME</a>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        const dono = localStorage.getItem("netlinks_user");
        let dadosLocais = { categorias: [], banners: [] };

        function togglePanel(id) {
            const panel = document.getElementById(id);
            const isOpened = panel.style.maxHeight;
            document.querySelectorAll('.panel').forEach(p => p.style.maxHeight = null);
            if (!isOpened) { panel.style.maxHeight = panel.scrollHeight + "px"; }
        }

        async function carregar() {
            // Sincroniza dados do usuário
            const pic = localStorage.getItem('netlinks_pic');
            const name = localStorage.getItem('netlinks_name');
            if(pic && name) {
                document.getElementById('userBadge').innerHTML = `
                    <img src="${pic}">
                    <span>${name}</span>
                `;
            }
            
            try {
                const res = await fetch(`${urlApp}?dono=${encodeURIComponent(dono)}`);
                dadosLocais = await res.json();
                const opts = '<option value="">Selecione...</option>' + 
                             dadosLocais.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
                document.getElementById('selectDelCat').innerHTML = opts;
                document.getElementById('selCatB').innerHTML = opts;
                document.getElementById('cadCatBanner').innerHTML = opts;
            } catch (e) { msg("Erro ao conectar."); }
        }

        function atualizarListaBanners() {
            const cat = document.getElementById('selCatB').value;
            const selB = document.getElementById('selBanner');
            const btn = document.getElementById('btnDelBanner');
            if(!cat) { selB.disabled = true; btn.disabled = true; return; }
            const bans = dadosLocais.banners.filter(b => b.categoria === cat);
            selB.innerHTML = bans.length ? '<option value="">Selecione...</option>' + bans.map(b => `<option value="${b.nome}">${b.nome}</option>`).join('') : '<option>Vazio</option>';
            selB.disabled = !bans.length;
        }

        document.getElementById('selBanner').onchange = function() {
            document.getElementById('btnDelBanner').disabled = !this.value;
        };

        // FUNÇÕES COM FEEDBACK DE PROGRESSO
        async function criarCategoria() {
            const n = document.getElementById('novaCat').value.trim();
            if(!n) return;
            setLoading('btnSaveCat', "Salvando...");
            await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "addCategory", nome: n, dono: dono }) });
            setTimeout(() => location.reload(), 1500);
        }

        async function criarBanner() {
            const cat = document.getElementById('cadCatBanner').value;
            const nome = document.getElementById('cadNomeBanner').value.trim();
            const url = document.getElementById('cadUrlBanner').value.trim();
            if(!cat || !nome || !url) { alert("Preencha todos os campos!"); return; }
            setLoading('btnSaveBanner', "Criando Link...");
            await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "addBanner", dono: dono, categoria: cat, nome: nome, imagem: "", link: url }) });
            setTimeout(() => location.reload(), 1500);
        }

        async function deletarCat() {
            const v = document.getElementById('selectDelCat').value;
            if(v && confirm(`Apagar "${v}" e todos os links dentro dele?`)) {
                setLoading('btnDelCat', "Removendo...");
                await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteCategory", nome: v, dono: dono }) });
                setTimeout(() => location.reload(), 1500);
            }
        }

        async function deletarBanner() {
            const c = document.getElementById('selCatB').value;
            const n = document.getElementById('selBanner').value;
            if(confirm(`Excluir o link "${n}"?`)) {
                setLoading('btnDelBanner', "Apagando...");
                await fetch(urlApp, { method:'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", categoria: c, nome: n, dono: dono }) });
                setTimeout(() => location.reload(), 1500);
            }
        }

        function setLoading(id, t) {
            const b = document.getElementById(id);
            b.disabled = true;
            b.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t}`;
            document.getElementById('status-msg').innerText = "Aguarde, processando na nuvem...";
        }

        function msg(t) { document.getElementById('status-msg').innerText = t; }
        carregar();
    </script>
</body>
</html>
