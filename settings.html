<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Configurações - NetLinks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .config-card { background: #2f2f2f; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; }
        h1 { color: #E50914; text-align: center; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; text-decoration: none; display: block; text-align: center; }
        .btn-add { background: #27ae60; }
        .btn-del { background: #E50914; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel de Controle</h1>
        <div class="config-card">
            <h2>Categorias</h2>
            <input type="text" id="novaCat" placeholder="Nome da Categoria">
            <button class="btn btn-add" onclick="enviarAcao('addCategory', 'novaCat')">CRIAR CATEGORIA</button>
            <hr style="margin:20px 0; border-color:#444;">
            <select id="selectDelCat"><option>Carregando categorias...</option></select>
            <button class="btn btn-del" onclick="deletarCat()">EXCLUIR CATEGORIA</button>
        </div>
        <div class="config-card" style="text-align:center;">
            <a href="cadastro.html" class="btn btn-add">ADICIONAR NOVO BANNER</a>
            <br>
            <a href="index.html" style="color:#aaa; text-decoration:none;">Voltar para o Início</a>
        </div>
    </div>
    <script>
        const CLIENT_ID = "136794075494-063o3rr6rd2umpcuu8nt097fg8sqbo9k.apps.googleusercontent.com";
        const urlApp = "SUA_URL_DO_APPS_SCRIPT_AQUI"; // <--- COLE SUA URL AQUI
        const dono = localStorage.getItem("netlinks_user");

        if(!dono) window.location.href = "index.html";

        async function carregar() {
            const res = await fetch(`${urlApp}?dono=${dono}`);
            const dados = await res.json();
            const opts = '<option value="">Selecione...</option>' + dados.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('selectDelCat').innerHTML = opts;
        }

        async function enviarAcao(acao, id) {
            const val = document.getElementById(id).value;
            if(!val) return;
            await fetch(urlApp, { method: 'POST', body: JSON.stringify({ action: acao, nome: val, dono: dono }) });
            location.reload();
        }

        async function deletarCat() {
            const val = document.getElementById('selectDelCat').value;
            if(confirm(`Excluir ${val}?`)) {
                await fetch(urlApp, { method: 'POST', body: JSON.stringify({ action: "deleteCategory", nome: val, dono: dono }) });
                location.reload();
            }
        }
        carregar();
    </script>
</body>
</html>
