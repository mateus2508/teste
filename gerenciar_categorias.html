<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - NetLinks</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #E50914; text-align: center; margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-add { background: #27ae60; color: white; margin-bottom: 10px; }
        .btn-add:hover { background: #219150; }
        .btn-del { background: #E50914; color: white; }
        .btn-del:hover { background: #b20710; }
        .btn-del:disabled { background: #555; cursor: not-allowed; }
        .btn-voltar { display: block; text-align: center; color: #aaa; text-decoration: none; margin-top: 25px; font-size: 14px; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
        hr { border: 0; border-top: 1px solid #444; margin: 25px 0; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Gerenciar Categorias</h2>
        
        <div id="status"></div>

        <label>Nome da Nova Categoria:</label>
        <input type="text" id="novaCat" placeholder="Ex: RH, FINANCEIRO...">
        <button class="btn btn-add" id="btnAdd" onclick="criarCategoria()">CRIAR CATEGORIA</button>

        <hr>

        <label>Excluir Categoria (e seus banners):</label>
        <select id="listaCats">
            <option value="">Carregando categorias...</option>
        </select>
        <button class="btn btn-del" id="btnDel" onclick="deletarCategoria()" disabled>EXCLUIR SELECIONADA</button>
        
        <a href="index.html" class="btn-voltar">Voltar para Início</a>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";

        // 1. BUSCA AS CATEGORIAS PARA PREENCHER O SELECT
        async function carregarCategorias() {
            const select = document.getElementById('listaCats');
            const btnDel = document.getElementById('btnDel');
            try {
                const res = await fetch(urlApp);
                const dados = await res.json();
                
                select.innerHTML = '<option value="">Selecione para excluir</option>';
                
                if (dados.categorias && dados.categorias.length > 0) {
                    // Remove duplicatas e valores vazios
                    const categoriasLimpas = [...new Set(dados.categorias)].filter(c => c && c.trim() !== "");
                    
                    categoriasLimpas.forEach(cat => {
                        select.innerHTML += `<option value="${cat}">${cat.toUpperCase()}</option>`;
                    });
                    btnDel.disabled = false;
                } else {
                    select.innerHTML = '<option value="">Nenhuma categoria encontrada</option>';
                    btnDel.disabled = true;
                }
            } catch (e) {
                select.innerHTML = '<option value="">Erro ao carregar</option>';
                console.error(e);
            }
        }

        // 2. FUNÇÃO PARA CRIAR NOVA CATEGORIA
        async function criarCategoria() {
            const nome = document.getElementById('novaCat').value.trim();
            const btn = document.getElementById('btnAdd');
            const status = document.getElementById('status');

            if (!nome) return alert("Digite um nome para a categoria!");

            btn.disabled = true;
            btn.innerText = "GRAVANDO...";
            status.innerText = "Conectando à planilha...";

            try {
                await fetch(urlApp, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "addCategory", nome: nome })
                });

                status.innerText = "Sucesso! Categoria criada.";
                status.style.color = "#27ae60";
                document.getElementById('novaCat').value = "";
                
                // Recarrega a lista após 1 segundo
                setTimeout(() => { 
                    status.innerText = "";
                    btn.disabled = false;
                    btn.innerText = "CRIAR CATEGORIA";
                    carregarCategorias(); 
                }, 1500);

            } catch (e) {
                status.innerText = "Erro ao gravar categoria.";
                status.style.color = "#E50914";
                btn.disabled = false;
            }
        }

        // 3. FUNÇÃO PARA EXCLUIR CATEGORIA
        async function deletarCategoria() {
            const nome = document.getElementById('listaCats').value;
            const btn = document.getElementById('btnDel');
            const status = document.getElementById('status');

            if (!nome) return alert("Selecione uma categoria!");
            if (!confirm(`AVISO CRÍTICO:\n\nAo excluir a categoria "${nome}", TODOS os banners vinculados a ela também serão apagados.\n\nDeseja continuar?`)) return;

            btn.disabled = true;
            btn.innerText = "EXCLUINDO...";

            try {
                await fetch(urlApp, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "deleteCategory", nome: nome })
                });

                status.innerText = "Categoria e banners removidos!";
                status.style.color = "#27ae60";

                setTimeout(() => { 
                    status.innerText = "";
                    btn.disabled = false;
                    btn.innerText = "EXCLUIR SELECIONADA";
                    carregarCategorias(); 
                }, 1500);

            } catch (e) {
                alert("Erro ao excluir.");
                btn.disabled = false;
            }
        }

        // Inicia carregando as categorias
        window.onload = carregarCategorias;
    </script>
</body>
</html>
