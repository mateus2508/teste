<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - NetLinks</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; }
        h2 { color: #E50914; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; background: #444; color: white; border: 1px solid #555; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-add { background: #27ae60; color: white; }
        .btn-del { background: #E50914; color: white; }
        .btn-voltar { display: block; text-align: center; color: #aaa; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Gerenciar Categorias</h2>
        
        <label>Nova Categoria:</label>
        <input type="text" id="novaCat" placeholder="Nome da categoria">
        <button class="btn btn-add" onclick="operacao('addCategory', 'novaCat')">CRIAR CATEGORIA</button>

        <hr style="margin: 30px 0; border-color: #444;">

        <label>Excluir Categoria (e todos os seus banners):</label>
        <select id="listaCats"><option>Carregando...</option></select>
        <button class="btn btn-del" onclick="operacao('deleteCategory', 'listaCats')">EXCLUIR CATEGORIA</button>
        
        <a href="index.html" class="btn-voltar">Voltar</a>
    </div>

    <script>
        const urlApp = "SUA_URL_AQUI";

        async function carregar() {
            const res = await fetch(urlApp);
            const dados = await res.json();
            const select = document.getElementById('listaCats');
            select.innerHTML = '<option value="">Selecione para excluir</option>';
            dados.categorias.forEach(cat => {
                if(cat) select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        async function operacao(acao, idCampo) {
            const valor = document.getElementById(idCampo).value;
            if(!valor) return alert("Preencha o campo!");
            if(acao === 'deleteCategory' && !confirm("ISSO APAGARÁ TODOS OS BANNERS DESTA CATEGORIA! Confirma?")) return;

            await fetch(urlApp, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: acao, nome: valor })
            });
            alert("Operação realizada!");
            location.reload();
        }
        carregar();
    </script>
</body>
</html>
