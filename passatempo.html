<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks Arcade - Edição Retro</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --p1: #3498db; --p2: #27ae60; --accent: #f1c40f; }
        body { background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); background-attachment: fixed; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; border-bottom: 1px solid #333; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .container { max-width: 1000px; margin: 10px auto; padding: 15px; flex: 1; text-align: center; padding-bottom: 100px; }
        .tab-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 18px; background: #222; border: 1px solid #444; color: #888; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ÁREA DO EMULADOR */
        #emu-wrap { width: 100%; max-width: 800px; height: 520px; margin: 0 auto; border: 8px solid #333; border-radius: 15px; background: #000; position: relative; overflow: hidden; }
        #emulator { width: 100%; height: 100%; }

        /* CAMPO MINADO 2P */
        .scoreboard { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-weight: bold; }
        .p-score { padding: 5px 15px; border-radius: 10px; border: 2px solid transparent; }
        .active-p1 { border-color: var(--p1); background: rgba(52, 152, 219, 0.1); }
        .active-p2 { border-color: var(--p2); background: rgba(39, 174, 96, 0.1); }
        #minesweeper { display: grid; grid-template-columns: repeat(10, 32px); gap: 3px; justify-content: center; }
        .cell { width: 32px; height: 32px; background: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #444; border-radius: 4px; }
        .cell.p1-mark { background: var(--p1) !important; color: white; }
        .cell.p2-mark { background: var(--p2) !important; color: white; }
        .cell.mine { background: var(--primary) !important; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 12px 4%; border-top: 1px solid #333; color: #666; font-size: 12px; z-index: 100; box-sizing: border-box; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div id="clock" style="font-weight: bold;">00:00:00</div>
    </header>

    <div class="container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="openTab('emu-tab')"><i class="fas fa-gamepad"></i> SUPER NINTENDO</button>
            <button class="tab-btn" onclick="openTab('mines-tab')"><i class="fas fa-user-friends"></i> MINADO 2P</button>
            <button class="tab-btn" onclick="openTab('snake-tab')"><i class="fas fa-snake"></i> SNAKE</button>
        </div>

        <div id="emu-tab" class="tab-content active">
            <div id="emu-wrap">
                <div id="emulator">
                    <button class="tab-btn" style="margin-top: 200px;" onclick="loadSnesGame()">CARREGAR JOGO DA MEMÓRIA</button>
                </div>
            </div>
            <p style="margin-top:10px; font-size: 0.8rem; color: #777;">Controles: Setas/WASD, Z, X, Enter (Start), Shift (Select). Clique no jogo para som.</p>
        </div>

        <div id="mines-tab" class="tab-content">
            <div class="scoreboard">
                <div id="sc1" class="p-score active-p1" style="color:var(--p1)">P1: 0</div>
                <div id="sc2" class="p-score" style="color:var(--p2)">P2: 0</div>
            </div>
            <div id="minesweeper"></div>
            <button class="tab-btn" style="margin-top:15px;" onclick="initMines()">RESET</button>
        </div>

        <div id="snake-tab" class="tab-content">
            <div style="margin-bottom:10px; font-weight:bold; color:var(--accent)">PONTOS: <span id="s-score">0</span></div>
            <canvas id="snakeGame" width="340" height="340"></canvas>
        </div>
    </div>

    <footer class="footer"><span>&copy; 2026 NetLinks Retro Arcade</span></footer>

    <script>
        // --- COLOQUE O SEU CÓDIGO BASE64 DENTRO DAS ASPAS ABAIXO ---
        const mySnesRom = "data:application/octet-stream;base64,COLE_AQUI_O_RESTANTE_DO_SEU_CODIGO";

        function loadSnesGame() {
            if(mySnesRom.length < 100) return alert("Por favor, cole o código Base64 completo no script!");
            
            document.getElementById('emulator').innerHTML = "";
            window.EJS_player = '#emulator';
            window.EJS_core = 'snes'; // Força o núcleo de Super Nintendo
            window.EJS_gameUrl = mySnesRom;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;
            window.EJS_mouse = true;

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.head.appendChild(script);
        }

        function openTab(id) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'mines-tab') initMines();
            if(id === 'snake-tab') startSnake();
        }

        // --- CAMPO MINADO 2P ---
        let turn = 1, p1S = 0, p2S = 0;
        function initMines() {
            const grid = document.getElementById("minesweeper"); grid.innerHTML = "";
            let mines = []; for(let i=0; i<100; i++) mines.push(Math.random() < 0.15);
            for(let i=0; i<100; i++) {
                const cell = document.createElement("div"); cell.className = "cell";
                cell.onclick = function() {
                    if(cell.classList.contains('revealed')) return;
                    cell.classList.add('revealed');
                    if(mines[i]) {
                        cell.classList.add('mine'); cell.innerHTML = "💣";
                        if(turn===1){ p2S++; alert("P1 Explodiu! Ponto para P2"); } else { p1S++; alert("P2 Explodiu! Ponto para P1"); }
                        initMines();
                    } else {
                        cell.classList.add(turn === 1 ? 'p1-mark' : 'p2-mark');
                        cell.innerHTML = "✔"; turn = (turn === 1) ? 2 : 1;
                        document.getElementById("sc1").classList.toggle('active-p1');
                        document.getElementById("sc2").classList.toggle('active-p2');
                    }
                    document.getElementById("sc1").innerText = "P1: "+p1S;
                    document.getElementById("sc2").innerText = "P2: "+p2S;
                };
                grid.appendChild(cell);
            }
        }

        // --- SNAKE GAME ---
        const sCanvas = document.getElementById("snakeGame");
        const sCtx = sCanvas.getContext("2d");
        let sBox = 20, snake, food, sScore, sD, sInt;

        function startSnake() {
            clearInterval(sInt); sD = null; sScore = 0;
            snake = [{x: 8*sBox, y: 8*sBox}];
            food = {x: Math.floor(Math.random()*16)*sBox, y: Math.floor(Math.random()*16)*sBox};
            sInt = setInterval(drawSnake, 130);
        }

        function drawSnake() {
            sCtx.fillStyle = "#000"; sCtx.fillRect(0,0,340,340);
            for(let i=0; i<snake.length; i++) {
                sCtx.fillStyle = (i==0) ? "#E50914" : "#fff";
                sCtx.fillRect(snake[i].x, snake[i].y, sBox, sBox);
            }
            sCtx.fillStyle = "#f1c40f"; sCtx.fillRect(food.x, food.y, sBox, sBox);
            let nX = snake[0].x, nY = snake[0].y;
            if(sD=="LEFT") nX -= sBox; if(sD=="UP") nY -= sBox;
            if(sD=="RIGHT") nX += sBox; if(sD=="DOWN") nY += sBox;

            if(nX == food.x && nY == food.y) {
                sScore++; food = {x: Math.floor(Math.random()*16)*sBox, y: Math.floor(Math.random()*16)*sBox};
            } else { snake.pop(); }

            if(nX<0 || nX>=340 || nY<0 || nY>=340 || snake.some(s => s.x==nX && s.y==nY)) {
                clearInterval(sInt); alert("GAME OVER! Pontos: " + sScore); startSnake(); return;
            }
            snake.unshift({x: nX, y: nY});
            document.getElementById("s-score").innerText = sScore;
        }

        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if((k=="arrowleft" || k=="a") && sD != "RIGHT") sD = "LEFT";
            if((k=="arrowup" || k=="w") && sD != "DOWN") sD = "UP";
            if((k=="arrowright" || k=="d") && sD != "LEFT") sD = "RIGHT";
            if((k=="arrowdown" || k=="s") && sD != "UP") sD = "DOWN";
        });

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
