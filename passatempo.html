<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passatempo - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5:gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; }
        body { background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); background-attachment: fixed; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; border-bottom: 1px solid #333; background: rgba(0,0,0,0.5); }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 20px; flex: 1; text-align: center; padding-bottom: 100px; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 10px; margin-bottom: 20px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: var(--primary); }

        /* JOGO DA COBRINHA */
        #game-container { background: #000; border: 4px solid #333; border-radius: 10px; position: relative; display: inline-block; margin-bottom: 30px; }
        canvas { display: block; border-radius: 5px; }
        .game-info { margin-top: 10px; font-size: 1.2rem; font-weight: bold; color: var(--primary); }

        /* SEÇÃO DE CURIOSIDADES/DIVERSÃO */
        .fun-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .fun-card { background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 15px; padding: 20px; transition: 0.3s; cursor: pointer; }
        .fun-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(255,255,255,0.08); }
        .fun-card i { font-size: 2rem; color: var(--primary); margin-bottom: 15px; }
        .fun-card h3 { margin: 0 0 10px 0; font-size: 1.1rem; text-transform: uppercase; }
        .fun-card p { font-size: 0.9rem; color: #ccc; line-height: 1.5; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 15px 4%; border-top: 1px solid #333; color: #666; font-size: 13px; z-index: 100; backdrop-filter: blur(10px); box-sizing: border-box; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <span style="color: #aaa;"><i class="fas fa-gamepad"></i> MODO PASSATEMPO</span>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> VOLTAR AO PAINEL</a>

        <h2><i class="fas fa-snake"></i> Jogo da Cobrinha</h2>
        <div id="game-container">
            <canvas id="snakeGame" width="400" height="400"></canvas>
            <div class="game-info">PONTOS: <span id="score">0</span></div>
        </div>
        <p style="color: #888; font-size: 0.8rem;">Use as setas do teclado para jogar!</p>

        <hr style="border:0; border-top:1px solid #333; margin: 40px 0;">

        <div class="fun-grid">
            <div class="fun-card" onclick="gerarCuriosidade()">
                <i class="fas fa-lightbulb"></i>
                <h3>Curiosidade</h3>
                <p id="txt-curiosidade">Clique para descobrir algo novo!</p>
            </div>
            <div class="fun-card" onclick="gerarHoroscopo()">
                <i class="fas fa-moon"></i>
                <h3>Horóscopo do Dia</h3>
                <p id="txt-horoscopo">O que os astros dizem hoje?</p>
            </div>
            <div class="fun-card" onclick="buscarReceita()">
                <i class="fas fa-utensils"></i>
                <h3>Ideia de Receita</h3>
                <p id="txt-receita">Sem ideias para o jantar?</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <span>&copy; 2026 <b>NetLinks Passatempo</b></span>
            <span id="clock" style="font-weight: bold; color: #fff;">00:00:00</span>
        </div>
    </footer>

    <script>
        // --- JOGO DA COBRINHA ---
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        let box = 20;
        let snake = [{x: 9 * box, y: 10 * box}];
        let food = {x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box};
        let score = 0;
        let d;

        document.addEventListener("keydown", direction);
        function direction(event) {
            if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(event.keyCode == 38 && d != "DOWN") d = "UP";
            else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let i = 0; i < snake.length; i++){
                ctx.fillStyle = (i == 0) ? "#E50914" : "white";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y){
                score++;
                scoreEl.innerHTML = score;
                food = {x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box};
            } else {
                snake.pop();
            }

            let newHead = {x: snakeX, y: snakeY};

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)){
                clearInterval(game);
                alert("Game Over! Pontos: " + score);
                location.reload();
            }
            snake.unshift(newHead);
        }

        function collision(head, array){
            for(let i = 0; i < array.length; i++) if(head.x == array[i].x && head.y == array[i].y) return true;
            return false;
        }
        let game = setInterval(draw, 100);

        // --- FUNÇÕES DE DIVERSÃO ---
        const curiosidades = [
            "O mel é o único alimento que não apodrece.",
            "As formigas não dormem.",
            "O coração da baleia azul é do tamanho de um fusca.",
            "Bananas são frutas vermelhas (botanicamente), mas morangos não.",
            "O Japão tem mais de 50.000 pessoas com mais de 100 anos."
        ];
        function gerarCuriosidade() {
            document.getElementById('txt-curiosidade').innerText = curiosidades[Math.floor(Math.random() * curiosidades.length)];
        }

        const frasesHoro = ["Hoje é um dia de sorte!", "Evite gastos desnecessários.", "Alguém do passado pode ligar.", "Foque na sua saúde hoje.", "Grandes oportunidades à vista!"];
        function gerarHoroscopo() {
            document.getElementById('txt-horoscopo').innerText = frasesHoro[Math.floor(Math.random() * frasesHoro.length)];
        }

        const receitas = ["Omelete de forno", "Macarrão alho e óleo", "Salada de frutas com mel", "Pão de queijo de caneca", "Sanduíche natural de frango"];
        function buscarReceita() {
            document.getElementById('txt-receita').innerText = "Que tal fazer: " + receitas[Math.floor(Math.random() * receitas.length)] + "?";
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
