<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passatempo Arcade - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; --accent: #f1c40f; }
        body { background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); background-attachment: fixed; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; border-bottom: 1px solid #333; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        .container { max-width: 900px; margin: 10px auto; padding: 10px; flex: 1; text-align: center; padding-bottom: 100px; }
        .tab-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 18px; background: #222; border: 1px solid #444; color: #888; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        canvas { background: #000; border: 4px solid #333; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .stats { margin: 10px 0; font-size: 1.1rem; color: var(--accent); font-weight: bold; text-transform: uppercase; }
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 12px 4%; border-top: 1px solid #333; color: #666; font-size: 12px; z-index: 100; box-sizing: border-box; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div id="clock" style="font-weight: bold;">00:00:00</div>
    </header>

    <div class="container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="openTab('snake-tab')"><i class="fas fa-snake"></i> SNAKE</button>
            <button class="tab-btn" onclick="openTab('race-tab')"><i class="fas fa-car"></i> CORRIDA</button>
            <button class="tab-btn" onclick="openTab('horo-tab')"><i class="fas fa-bolt"></i> JOÃO BIDU</button>
        </div>

        <div id="snake-tab" class="tab-content active">
            <div class="stats">SCORE: <span id="s-score">0</span> | NÍVEL: <span id="s-level">1</span></div>
            <canvas id="snakeGame" width="360" height="360"></canvas>
        </div>

        <div id="race-tab" class="tab-content">
            <div class="stats">SCORE: <span id="r-score">0</span></div>
            <canvas id="raceGame" width="320" height="400"></canvas>
        </div>

        <div id="horo-tab" class="tab-content">
            <h3>Horóscopo João Bidu</h3>
            <p style="color: #aaa;">Selecione seu signo para previsão real.</p>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                <button class="tab-btn" onclick="window.open('https://www.joaobidu.com.br/horoscopo/', '_blank')">♈ Áries</button>
                <button class="tab-btn" onclick="window.open('https://www.joaobidu.com.br/horoscopo/', '_blank')">♉ Touro</button>
                <button class="tab-btn" onclick="window.open('https://www.joaobidu.com.br/horoscopo/', '_blank')">♊ Gêmeos</button>
            </div>
        </div>
    </div>

    <footer class="footer"><span>&copy; 2026 NetLinks Games</span></footer>

    <script>
        function openTab(id) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            stopAllGames();
            if(id === 'snake-tab') startSnake();
            if(id === 'race-tab') startRace();
        }

        function stopAllGames() {
            clearInterval(sInt);
            clearInterval(rInt);
        }

        // --- SNAKE GAME ---
        const sCanvas = document.getElementById("snakeGame");
        const sCtx = sCanvas.getContext("2d");
        let sBox = 20, snake, food, sScore, sLevel, sD, sInt, sSpeed;

        function startSnake() {
            clearInterval(sInt);
            snake = [{x: 8 * sBox, y: 8 * sBox}];
            food = {x: Math.floor(Math.random()*17+1)*sBox, y: Math.floor(Math.random()*17+1)*sBox};
            sScore = 0; sLevel = 1; sSpeed = 160; sD = null;
            document.getElementById("s-score").innerText = sScore;
            document.getElementById("s-level").innerText = sLevel;
            sInt = setInterval(drawSnake, sSpeed);
        }

        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if((k=="arrowleft" || k=="a") && sD != "RIGHT") sD = "LEFT";
            else if((k=="arrowup" || k=="w") && sD != "DOWN") sD = "UP";
            else if((k=="arrowright" || k=="d") && sD != "LEFT") sD = "RIGHT";
            else if((k=="arrowdown" || k=="s") && sD != "UP") sD = "DOWN";
        });

        function drawSnake() {
            sCtx.fillStyle = "#000"; sCtx.fillRect(0,0,360,360);
            for(let i=0; i<snake.length; i++){
                sCtx.fillStyle = (i==0) ? "#E50914" : "#fff";
                sCtx.fillRect(snake[i].x, snake[i].y, sBox, sBox);
            }
            sCtx.fillStyle = "#f1c40f"; sCtx.fillRect(food.x, food.y, sBox, sBox);
            let nX = snake[0].x; let nY = snake[0].y;
            if(sD=="LEFT") nX -= sBox; if(sD=="UP") nY -= sBox;
            if(sD=="RIGHT") nX += sBox; if(sD=="DOWN") nY += sBox;

            if(nX == food.x && nY == food.y){
                sScore++; document.getElementById("s-score").innerText = sScore;
                if(sScore % 4 == 0) {
                    sLevel++; document.getElementById("s-level").innerText = sLevel;
                    clearInterval(sInt); sSpeed = Math.max(50, sSpeed - 20);
                    sInt = setInterval(drawSnake, sSpeed);
                }
                food = {x: Math.floor(Math.random()*17+1)*sBox, y: Math.floor(Math.random()*17+1)*sBox};
            } else { snake.pop(); }

            if(nX<0 || nX>=360 || nY<0 || nY>=360 || snake.some(s => s.x==nX && s.y==nY)){
                clearInterval(sInt);
                alert("GAME OVER! Pontos: " + sScore);
                startSnake();
                return;
            }
            snake.unshift({x: nX, y: nY});
        }

        // --- CORRIDA ---
        const rCanvas = document.getElementById("raceGame");
        const rCtx = rCanvas.getContext("2d");
        let rX, rObs, rScore, rInt;

        function startRace() {
            clearInterval(rInt);
            rX = 145; rObs = []; rScore = 0;
            rInt = setInterval(drawRace, 30);
        }

        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if(k=="arrowleft" || k=="a") rX = Math.max(10, rX - 25);
            if(k=="arrowright" || k=="d") rX = Math.min(280, rX + 25);
        });

        function drawRace() {
            rCtx.fillStyle = "#222"; rCtx.fillRect(0,0,320,400);
            // Desenha Carro
            rCtx.fillStyle = "#3498db"; rCtx.fillRect(rX, 340, 30, 50); 
            rCtx.fillStyle = "#000"; rCtx.fillRect(rX-5, 345, 5, 10); rCtx.fillRect(rX+30, 345, 5, 10); // Rodas

            if(Math.random() < 0.04) rObs.push({x: Math.random()*280, y: -50});
            
            rCtx.fillStyle = "#E50914";
            for(let i=0; i<rObs.length; i++) {
                rObs[i].y += 6;
                rCtx.fillRect(rObs[i].x, rObs[i].y, 35, 35);
                // Colisão
                if(rObs[i].y > 310 && rObs[i].y < 390 && rObs[i].x < rX+30 && rObs[i].x+35 > rX) {
                    clearInterval(rInt);
                    alert("BATIDA! Score: " + rScore);
                    startRace();
                    return;
                }
                if(rObs[i].y > 400) { rObs.splice(i, 1); rScore++; i--; }
            }
            document.getElementById("r-score").innerText = rScore;
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        startSnake();
    </script>
</body>
</html>
