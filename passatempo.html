<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passatempo Arcade - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; --accent: #f1c40f; --blue: #3498db; }
        body { background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); background-attachment: fixed; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; border-bottom: 1px solid #333; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 20px; flex: 1; text-align: center; padding-bottom: 120px; }
        
        .tab-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 18px; background: #222; border: 1px solid #444; color: #888; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* JOGOS */
        canvas { background: #000; border: 4px solid #333; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .stats { margin: 10px 0; font-size: 1.1rem; color: var(--accent); font-weight: bold; text-transform: uppercase; }

        /* CAMPO MINADO */
        #minesweeper { display: grid; grid-template-columns: repeat(10, 32px); gap: 2px; justify-content: center; margin-top: 15px; }
        .cell { width: 32px; height: 32px; background: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; border-radius: 4px; border: 1px solid #444; }
        .cell:hover { background: #444; }
        .cell.revealed { background: #111; cursor: default; border: 1px solid #222; }
        .cell.mine { background: var(--primary); color: white; }

        /* HORÓSCOPO */
        .signo-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0; }
        .signo-dot { padding: 8px 12px; background: #222; border: 1px solid #444; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .signo-dot:hover, .signo-dot.selected { background: var(--blue); color: white; }
        .horoscopo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; text-align: left; }
        .horo-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border-left: 4px solid var(--blue); }
        .horo-card h4 { margin: 0 0 8px 0; color: var(--blue); font-size: 0.85rem; text-transform: uppercase; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 12px 4%; border-top: 1px solid #333; color: #666; font-size: 12px; z-index: 100; backdrop-filter: blur(10px); box-sizing: border-box; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div id="clock" style="font-weight: bold; color: #fff;">00:00:00</div>
    </header>

    <div class="container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="openTab('snake-tab')"><i class="fas fa-snake"></i> SNAKE</button>
            <button class="tab-btn" onclick="openTab('race-tab')"><i class="fas fa-car-side"></i> F1 RACE</button>
            <button class="tab-btn" onclick="openTab('mines-tab')"><i class="fas fa-bomb"></i> MINADO</button>
            <button class="tab-btn" onclick="openTab('horo-tab')"><i class="fas fa-star"></i> HORÓSCOPO</button>
        </div>

        <div id="snake-tab" class="tab-content active">
            <div class="stats">PONTOS: <span id="s-score">0</span> | NÍVEL: <span id="s-level">1</span></div>
            <canvas id="snakeGame" width="360" height="360"></canvas>
        </div>

        <div id="race-tab" class="tab-content">
            <div class="stats">SCORE: <span id="r-score">0</span></div>
            <canvas id="raceGame" width="320" height="420"></canvas>
        </div>

        <div id="mines-tab" class="tab-content">
            <div class="stats">CAMPO MINADO</div>
            <div id="minesweeper"></div>
            <button class="tab-btn" style="margin-top:20px; background:#444;" onclick="initMines()">REINICIAR TABULEIRO</button>
        </div>

        <div id="horo-tab" class="tab-content">
            <h2>Horóscopo do Dia</h2>
            <div class="signo-selector">
                <div class="signo-dot" onclick="getHoro('aries', this)">♈ Áries</div>
                <div class="signo-dot" onclick="getHoro('touro', this)">♉ Touro</div>
                <div class="signo-dot" onclick="getHoro('gemeos', this)">♊ Gêmeos</div>
                <div class="signo-dot" onclick="getHoro('cancer', this)">♋ Câncer</div>
                <div class="signo-dot" onclick="getHoro('leao', this)">♌ Leão</div>
                <div class="signo-dot" onclick="getHoro('virgem', this)">♍ Virgem</div>
                <div class="signo-dot" onclick="getHoro('libra', this)">♎ Libra</div>
                <div class="signo-dot" onclick="getHoro('escorpiao', this)">♏ Escorpião</div>
                <div class="signo-dot" onclick="getHoro('sagitario', this)">♐ Sagitário</div>
                <div class="signo-dot" onclick="getHoro('capricornio', this)">♑ Capricórnio</div>
                <div class="signo-dot" onclick="getHoro('aquario', this)">♒ Aquário</div>
                <div class="signo-dot" onclick="getHoro('peixes', this)">♓ Peixes</div>
            </div>
            <div id="horo-res" style="display:none;" class="horoscopo-grid">
                <div class="horo-card"><h4><i class="fas fa-briefcase"></i> Trabalho</h4><p id="h-trab"></p></div>
                <div class="horo-card" style="border-left-color:#e74c3c;"><h4><i class="fas fa-heart"></i> Amor</h4><p id="h-amor"></p></div>
            </div>
        </div>
    </div>

    <footer class="footer"><span>&copy; 2026 <b>NetLinks Arcade</b></span></footer>

    <script>
        function openTab(id) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            stopGames();
            if(id === 'snake-tab') startSnake();
            if(id === 'race-tab') startRace();
            if(id === 'mines-tab') initMines();
        }

        function stopGames() { clearInterval(sInt); clearInterval(rInt); }

        // --- SNAKE ---
        const sCanvas = document.getElementById("snakeGame");
        const sCtx = sCanvas.getContext("2d");
        let sBox = 20, snake, food, sScore, sLevel, sD, sInt, sSpeed;

        function startSnake() {
            clearInterval(sInt);
            snake = [{x: 8*sBox, y: 8*sBox}];
            food = {x: Math.floor(Math.random()*17+1)*sBox, y: Math.floor(Math.random()*17+1)*sBox};
            sScore = 0; sLevel = 1; sSpeed = 160; sD = null;
            document.getElementById("s-score").innerText = 0;
            document.getElementById("s-level").innerText = 1;
            sInt = setInterval(drawSnake, sSpeed);
        }

        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if((k=="arrowleft" || k=="a") && sD != "RIGHT") sD = "LEFT";
            if((k=="arrowup" || k=="w") && sD != "DOWN") sD = "UP";
            if((k=="arrowright" || k=="d") && sD != "LEFT") sD = "RIGHT";
            if((k=="arrowdown" || k=="s") && sD != "UP") sD = "DOWN";
        });

        function drawSnake() {
            sCtx.fillStyle = "#000"; sCtx.fillRect(0,0,360,360);
            for(let i=0; i<snake.length; i++) {
                sCtx.fillStyle = (i==0) ? "#E50914" : "#fff";
                sCtx.fillRect(snake[i].x, snake[i].y, sBox, sBox);
            }
            sCtx.fillStyle = "#f1c40f"; sCtx.fillRect(food.x, food.y, sBox, sBox);
            let nX = snake[0].x, nY = snake[0].y;
            if(sD=="LEFT") nX -= sBox; if(sD=="UP") nY -= sBox;
            if(sD=="RIGHT") nX += sBox; if(sD=="DOWN") nY += sBox;

            if(nX == food.x && nY == food.y) {
                sScore++; document.getElementById("s-score").innerText = sScore;
                if(sScore % 4 == 0) {
                    sLevel++; document.getElementById("s-level").innerText = sLevel;
                    clearInterval(sInt); sSpeed = Math.max(50, sSpeed - 20);
                    sInt = setInterval(drawSnake, sSpeed);
                }
                food = {x: Math.floor(Math.random()*17+1)*sBox, y: Math.floor(Math.random()*17+1)*sBox};
            } else { snake.pop(); }

            if(nX<0 || nX>=360 || nY<0 || nY>=360 || snake.some((s,idx) => idx !==0 && s.x==nX && s.y==nY)) {
                clearInterval(sInt); alert("GAME OVER! Score: " + sScore); startSnake(); return;
            }
            snake.unshift({x: nX, y: nY});
        }

        // --- F1 RACE (UPGRADE GRÁFICO) ---
        const rCanvas = document.getElementById("raceGame");
        const rCtx = rCanvas.getContext("2d");
        let rX, rObs, rScore, rInt;

        function startRace() {
            clearInterval(rInt); rX = 145; rObs = []; rScore = 0;
            rInt = setInterval(drawRace, 30);
        }

        function drawRace() {
            rCtx.fillStyle = "#111"; rCtx.fillRect(0,0,320,420);
            
            // Desenha Carro F1
            rCtx.fillStyle = "#E50914"; // Vermelho Ferrari
            rCtx.fillRect(rX+10, 340, 10, 50); // Corpo central
            rCtx.fillRect(rX, 380, 30, 10);    // Aerofólio traseiro
            rCtx.fillRect(rX, 350, 30, 5);     // Eixo dianteiro
            rCtx.fillStyle = "#000"; 
            rCtx.fillRect(rX-5, 345, 8, 12); rCtx.fillRect(rX+27, 345, 8, 12); // Rodas frente
            rCtx.fillRect(rX-7, 375, 10, 15); rCtx.fillRect(rX+27, 375, 10, 15); // Rodas trás

            if(Math.random() < 0.05) rObs.push({x: Math.random()*280, y: -50});
            for(let i=0; i<rObs.length; i++) {
                rObs[i].y += 6;
                // Desenha Obstáculo (Pneu)
                rCtx.fillStyle = "#555";
                rCtx.beginPath();
                rCtx.arc(rObs[i].x+15, rObs[i].y+15, 15, 0, Math.PI*2);
                rCtx.fill();
                rCtx.fillStyle = "#333";
                rCtx.beginPath();
                rCtx.arc(rObs[i].x+15, rObs[i].y+15, 7, 0, Math.PI*2);
                rCtx.fill();

                if(rObs[i].y > 330 && rObs[i].y < 390 && rObs[i].x < rX+30 && rObs[i].x+30 > rX) {
                    clearInterval(rInt); alert("BATIDA! Score: " + rScore); startRace(); return;
                }
                if(rObs[i].y > 420) { rObs.splice(i, 1); rScore++; i--; }
            }
            document.getElementById("r-score").innerText = rScore;
        }
        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if(k=="arrowleft" || k=="a") rX = Math.max(10, rX - 25);
            if(k=="arrowright" || k=="d") rX = Math.min(280, rX + 25);
        });

        // --- CAMPO MINADO ---
        function initMines() {
            const grid = document.getElementById("minesweeper");
            grid.innerHTML = "";
            let mines = [];
            for(let i=0; i<100; i++) mines.push(Math.random() < 0.15);

            for(let i=0; i<100; i++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.onclick = function() {
                    if(mines[i]) {
                        cell.className = "cell mine"; cell.innerHTML = "💣";
                        alert("BOOM! Fim de jogo."); initMines();
                    } else {
                        cell.className = "cell revealed"; cell.innerHTML = "✔";
                        cell.style.color = "#27ae60";
                    }
                };
                grid.appendChild(cell);
            }
        }

        // --- HORÓSCOPO ---
        function getHoro(signo, el) {
            document.querySelectorAll('.signo-dot').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('horo-res').style.display = 'grid';
            const t = ["Dia produtivo, foque na organização.","Cuidado com mal-entendidos no trabalho.","Novas ideias trarão lucros em breve.","Mantenha a calma sob pressão hoje."];
            const a = ["Momento de carinho e união.","Abra o coração para novas conversas.","Evite ciúmes bobos neste dia.","Uma surpresa especial pode chegar."];
            document.getElementById('h-trab').innerText = t[Math.floor(Math.random()*t.length)];
            document.getElementById('h-amor').innerText = a[Math.floor(Math.random()*a.length)];
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        startSnake();
    </script>
</body>
</html>
