<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLinks Arcade - Edição Definitiva</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --p1: #3498db; --p2: #27ae60; --accent: #f1c40f; }
        body { background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); background-attachment: fixed; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; border-bottom: 1px solid #333; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 10px auto; padding: 15px; flex: 1; text-align: center; padding-bottom: 100px; width: 100%; box-sizing: border-box; }
        
        .tab-menu { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 18px; background: #222; border: 1px solid #444; color: #888; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; border: none; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 0 10px var(--primary); }

        .tab-content { display: none; height: 100%; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* AREA DO EMULADOR */
        #emu-wrap { width: 100%; max-width: 800px; height: 500px; margin: 0 auto; border: 6px solid #333; border-radius: 15px; background: #000; position: relative; overflow: hidden; }
        #emulator { width: 100%; height: 100%; }
        
        .drop-area { padding: 60px 20px; border: 2px dashed #444; margin: 20px; border-radius: 15px; cursor: pointer; }
        .drop-area:hover { border-color: var(--primary); background: rgba(255,255,255,0.02); }

        /* CAMPO MINADO 2P */
        #minesweeper { display: grid; grid-template-columns: repeat(10, 32px); gap: 3px; justify-content: center; margin-top: 15px; }
        .cell { width: 32px; height: 32px; background: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; border: 1px solid #444; }
        .cell.p1-mark { background: var(--p1) !important; color: white; }
        .cell.p2-mark { background: var(--p2) !important; color: white; }
        .cell.mine { background: var(--primary) !important; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 12px 4%; border-top: 1px solid #333; color: #666; font-size: 12px; z-index: 100; backdrop-filter: blur(10px); box-sizing: border-box; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div id="clock" style="font-weight: bold; color: #fff;">00:00:00</div>
    </header>

    <div class="container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="openTab('emu-tab')"><i class="fas fa-gamepad"></i> CONSOLE RETRÔ</button>
            <button class="tab-btn" onclick="openTab('mines-tab')"><i class="fas fa-user-friends"></i> MINADO 2P</button>
            <button class="tab-btn" onclick="openTab('snake-tab')"><i class="fas fa-snake"></i> SNAKE</button>
            <button class="tab-btn" onclick="openTab('horo-tab')"><i class="fas fa-star"></i> HORÓSCOPO</button>
        </div>

        <div id="emu-tab" class="tab-content active">
            <div id="emu-wrap">
                <div id="drop-zone" class="drop-area">
                    <i class="fas fa-file-download" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>
                    <h3>Carregar Jogo (.smc, .sfc, .nes)</h3>
                    <p style="color: #666; font-size: 0.8rem;">Arraste o arquivo aqui ou clique no botão</p>
                    <input type="file" id="file-input" accept=".nes,.smc,.sfc" style="margin-top:20px;">
                </div>
                <div id="emulator"></div>
            </div>
            <p style="margin-top:10px; font-size: 0.75rem; color: #888;">DICA: Clique na tela do jogo para ativar o som e os controles.</p>
        </div>

        <div id="mines-tab" class="tab-content">
            <div id="minesweeper"></div>
            <button class="tab-btn" style="margin-top:15px;" onclick="initMines()">RESET PARTIDA</button>
        </div>
        <div id="snake-tab" class="tab-content">
            <canvas id="snakeGame" width="340" height="340"></canvas>
        </div>
        <div id="horo-tab" class="tab-content">
            <button class="tab-btn" onclick="window.open('https://www.joaobidu.com.br/horoscopo/', '_blank')">ABRIR HORÓSCOPO REAL</button>
        </div>
    </div>

    <footer class="footer"><span>&copy; 2026 <b>NetLinks Arcade Pro</b></span></footer>

    <script>
        function openTab(id) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'mines-tab') initMines();
            if(id === 'snake-tab') startSnake();
        }

        // --- LÓGICA DO NOVO EMULADOR ---
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const romData = event.target.result;
                const extension = file.name.split('.').pop().toLowerCase();
                let system = (extension === 'nes') ? 'nes' : 'snes';

                document.getElementById('drop-zone').style.display = 'none';

                // Configuração do EmulatorJS
                window.EJS_player = '#emulator';
                window.EJS_core = system;
                window.EJS_gameUrl = romData; // Carrega o arquivo local direto na memória
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Arquivos do motor
                window.EJS_startOnLoaded = true;
                window.EJS_mouse = true; // Habilita o MOUSE
                window.EJS_multitap = true;

                // Carrega o script do motor de forma dinâmica
                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                document.head.appendChild(script);
            };
            reader.readAsDataURL(file);
        });

        // --- CAMPO MINADO 2P (ESTÁVEL) ---
        let p1S = 0, p2S = 0, turn = 1;
        function initMines() {
            const grid = document.getElementById("minesweeper"); grid.innerHTML = "";
            let mines = []; for(let i=0; i<100; i++) mines.push(Math.random() < 0.15);
            for(let i=0; i<100; i++) {
                const cell = document.createElement("div"); cell.className = "cell";
                cell.onclick = function() {
                    if(cell.classList.contains('revealed')) return;
                    cell.classList.add('revealed');
                    if(mines[i]) {
                        cell.classList.add('mine'); cell.innerHTML = "💣";
                        if(turn === 1) { p2S++; alert("P1 Explodiu! Ponto P2"); } else { p1S++; alert("P2 Explodiu! Ponto P1"); }
                        initMines();
                    } else {
                        cell.classList.add(turn === 1 ? 'p1-mark' : 'p2-mark');
                        cell.innerHTML = "✔"; turn = turn === 1 ? 2 : 1;
                    }
                };
                grid.appendChild(cell);
            }
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        initMines();
    </script>
</body>
</html>
