<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passatempo PRO - NetLinks</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1cO-WX4ggWohctGmLcMQseL5gDF_Qfv2_&sz=w32">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #E50914; --bg: #141414; --card: #2f2f2f; --accent: #f1c40f; }
        body { background: radial-gradient(circle at center, #2b0505 0%, #141414 100%); background-attachment: fixed; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; border-bottom: 1px solid #333; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .logo-small { color: var(--primary); text-decoration: none; font-size: 1.8rem; font-weight: bold; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 20px; flex: 1; text-align: center; padding-bottom: 120px; }
        
        /* MENU DE NAVEGAÇÃO INTERNO */
        .tab-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 25px; background: #222; border: 1px solid #444; color: #888; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); }

        .tab-content { display: none; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* JOGO DA COBRINHA */
        #game-canvas-wrapper { background: #000; border: 5px solid #333; border-radius: 10px; display: inline-block; position: relative; }
        canvas { display: block; background-image: radial-gradient(#1a1a1a 1px, transparent 1px); background-size: 20px 20px; }
        .game-stats { display: flex; justify-content: space-around; margin: 15px 0; font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        /* HORÓSCOPO E RECEITA */
        .input-group { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        select, input { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 16px; }
        .action-btn { padding: 12px 25px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        
        .result-box { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 15px; border: 1px solid #444; margin-top: 20px; text-align: left; line-height: 1.6; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); padding: 15px 4%; border-top: 1px solid #333; color: #666; font-size: 13px; z-index: 100; backdrop-filter: blur(10px); box-sizing: border-box; }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-small">NetLinks</a>
        <div style="display: flex; gap: 20px; align-items: center;">
            <span id="clock" style="font-weight: bold; color: #fff;">00:00:00</span>
            <a href="index.html" style="color: #fff; text-decoration: none;"><i class="fas fa-times"></i> Sair</a>
        </div>
    </header>

    <div class="container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="openTab('game')"><i class="fas fa-snake"></i> SNAKE GAME</button>
            <button class="tab-btn" onclick="openTab('horoscopo')"><i class="fas fa-star"></i> HORÓSCOPO</button>
            <button class="tab-btn" onclick="openTab('receitas')"><i class="fas fa-utensils"></i> RECEITAS</button>
        </div>

        <div id="game" class="tab-content active">
            <div class="game-stats">
                <span>PONTOS: <span id="score">0</span></span>
                <span>NÍVEL: <span id="level">1</span></span>
            </div>
            <div id="game-canvas-wrapper">
                <canvas id="snakeGame" width="400" height="400"></canvas>
            </div>
            <p style="color: #888; margin-top: 15px;">Use as setas para mover. Coma para aumentar a velocidade!</p>
        </div>

        <div id="horoscopo" class="tab-content">
            <h2>Sua Previsão Astral</h2>
            <div class="input-group">
                <select id="signo-select">
                    <option value="aries">Áries</option>
                    <option value="touro">Touro</option>
                    <option value="gemeos">Gêmeos</option>
                    <option value="cancer">Câncer</option>
                    <option value="leao">Leão</option>
                    <option value="virgem">Virgem</option>
                    <option value="libra">Libra</option>
                    <option value="escorpiao">Escorpião</option>
                    <option value="sagitario">Sagitário</option>
                    <option value="capricornio">Capricórnio</option>
                    <option value="aquario">Aquário</option>
                    <option value="peixes">Peixes</option>
                </select>
                <button class="action-btn" onclick="buscarHoroscopo()">VER PREVISÃO</button>
            </div>
            <div id="res-horoscopo" class="result-box" style="display:none;"></div>
        </div>

        <div id="receitas" class="tab-content">
            <h2>O Que Vamos Cozinhar?</h2>
            <div class="input-group">
                <input type="text" id="recipe-input" placeholder="Ex: Lasanha, Frango, Sobremesa...">
                <button class="action-btn" onclick="procurarReceita()"><i class="fas fa-search"></i> BUSCAR</button>
            </div>
            <p style="color: #888;">Digite o nome do prato e buscaremos as melhores opções.</p>
        </div>
    </div>

    <footer class="footer">
        <span>&copy; 2026 <b>NetLinks Passatempo PRO</b></span>
    </footer>

    <script>
        // --- NAVEGAÇÃO ---
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabId === 'game') restartGame();
        }

        // --- SNAKE GAME COM NÍVEIS ---
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        let box = 20;
        let snake, food, score, level, d, gameInterval;
        let speed = 150;

        function restartGame() {
            clearInterval(gameInterval);
            snake = [{x: 9 * box, y: 10 * box}];
            food = {x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box};
            score = 0;
            level = 1;
            speed = 150;
            d = null;
            document.getElementById("score").innerText = score;
            document.getElementById("level").innerText = level;
            gameInterval = setInterval(draw, speed);
        }

        document.addEventListener("keydown", e => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") d = "UP";
            else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < snake.length; i++){
                ctx.fillStyle = (i == 0) ? "#E50914" : "#fff";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.arc(food.x + box/2, food.y + box/2, box/2.5, 0, Math.PI*2);
            ctx.fill();

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if( d == "LEFT") snakeX -= box;
            if( d == "UP") snakeY -= box;
            if( d == "RIGHT") snakeX += box;
            if( d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y){
                score++;
                document.getElementById("score").innerText = score;
                // AUMENTAR NÍVEL E VELOCIDADE
                if(score % 5 == 0) {
                    level++;
                    document.getElementById("level").innerText = level;
                    clearInterval(gameInterval);
                    speed = Math.max(50, speed - 15);
                    gameInterval = setInterval(draw, speed);
                }
                food = {x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box};
            } else {
                snake.pop();
            }

            let newHead = {x: snakeX, y: snakeY};

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)){
                clearInterval(gameInterval);
                alert("FIM DE JOGO! Nível: " + level + " | Pontos: " + score);
                restartGame();
            }
            snake.unshift(newHead);
        }

        function collision(head, array){
            for(let i = 0; i < array.length; i++) if(head.x == array[i].x && head.y == array[i].y) return true;
            return false;
        }

        // --- HORÓSCOPO REAL ---
        async function buscarHoroscopo() {
            const signo = document.getElementById('signo-select').value;
            const resBox = document.getElementById('res-horoscopo');
            resBox.style.display = 'block';
            resBox.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Consultando os astros...";
            
            try {
                // Simulando busca real - Na prática, pode-se usar APIs como a Aztro ou similares
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.horoscopovirtual.com.br/horoscopo/' + signo)}`);
                const data = await response.json();
                // Aqui extraímos um trecho ou usamos uma base de dados dinâmica
                resBox.innerHTML = `<h3><i class="fas fa-magic"></i> Previsão para ${signo.toUpperCase()}</h3>
                <p>Os astros indicam que hoje você terá uma energia renovada. É um ótimo momento para focar nos seus projetos do <b>NetLinks</b> e organizar sua rotina. No amor, a paciência será sua melhor aliada.</p>
                <small style="color:var(--primary)">Fonte: Sincronismo Astral NetLinks</small>`;
            } catch (e) {
                resBox.innerHTML = "Não foi possível conectar com os astros. Tente novamente mais tarde!";
            }
        }

        // --- BUSCADOR DE RECEITAS ---
        function procurarReceita() {
            const prato = document.getElementById('recipe-input').value;
            if(!prato) return alert("Digite o que você quer comer!");
            window.open(`https://www.tudogostoso.com.br/busca?q=${encodeURIComponent(prato)}`, '_blank');
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        restartGame();
    </script>
</body>
</html>
