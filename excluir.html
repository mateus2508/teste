<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Banner - NetLinks</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; }
        h2 { color: #E50914; text-align: center; }
        .campo { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; }
        select { width: 100%; padding: 12px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; }
        .btn-excluir { background: #E50914; color: white; border: none; padding: 14px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-excluir:disabled { background: #555; }
        .btn-voltar { display: block; text-align: center; color: #fff; text-decoration: none; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Excluir Banner</h2>
        
        <div class="campo">
            <label>1. Selecione a Categoria:</label>
            <select id="categoria" onchange="filtrarBanners()">
                <option value="">Carregando categorias...</option>
            </select>
        </div>

        <div class="campo">
            <label>2. Selecione o Banner:</label>
            <select id="listaBanners" disabled>
                <option value="">Selecione a categoria primeiro</option>
            </select>
        </div>

        <button class="btn-excluir" id="btnExcluir" onclick="deletar()" disabled>EXCLUIR AGORA</button>
        <a href="index.html" class="btn-voltar">Voltar</a>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbzTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        let todosBanners = [];

        async function carregarDados() {
            const res = await fetch(urlApp);
            todosBanners = await res.json();
            
            const categorias = [...new Set(todosBanners.map(b => b.categoria))];
            const selectCat = document.getElementById('categoria');
            selectCat.innerHTML = '<option value="">Escolha uma categoria</option>';
            categorias.forEach(cat => {
                selectCat.innerHTML += `<option value="${cat}">${cat.toUpperCase()}</option>`;
            });
        }

        function filtrarBanners() {
            const catSelected = document.getElementById('categoria').value;
            const selectBanner = document.getElementById('listaBanners');
            const btn = document.getElementById('btnExcluir');
            
            const filtrados = todosBanners.filter(b => b.categoria === catSelected);
            
            selectBanner.innerHTML = '<option value="">Selecione o banner</option>';
            filtrados.forEach(b => {
                selectBanner.innerHTML += `<option value="${b.nome}">${b.nome}</option>`;
            });
            
            selectBanner.disabled = filtrados.length === 0;
            btn.disabled = filtrados.length === 0;
        }

        async function deletar() {
            const categoria = document.getElementById('categoria').value;
            const nome = document.getElementById('listaBanners').value;
            const btn = document.getElementById('btnExcluir');

            if (!confirm(`Tem certeza que deseja excluir o banner "${nome}"?`)) return;

            btn.disabled = true;
            btn.innerText = "EXCLUINDO...";

            await fetch(urlApp, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: "delete", categoria, nome })
            });

            alert("Solicitação enviada! A planilha será atualizada.");
            window.location.href = "index.html";
        }

        carregarDados();
    </script>
</body>
</html>
