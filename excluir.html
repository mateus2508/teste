<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Banner - NetLinks</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: #2f2f2f; padding: 30px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #E50914; text-align: center; margin-bottom: 25px; }
        .campo { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        select { width: 100%; padding: 12px; border-radius: 4px; background: #444; color: white; border: 1px solid #555; outline: none; cursor: pointer; }
        select:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-excluir { background: #E50914; color: white; border: none; padding: 14px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-excluir:hover:not(:disabled) { background: #b20710; }
        .btn-excluir:disabled { background: #555; }
        .btn-voltar { display: block; text-align: center; color: #fff; text-decoration: none; margin-top: 20px; font-size: 14px; opacity: 0.8; }
        .btn-voltar:hover { opacity: 1; }
        #msg-status { margin-top: 15px; text-align: center; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Excluir Banner</h2>
        
        <div class="campo">
            <label>1. Escolha o Segmento:</label>
            <select id="categoria" onchange="filtrarBanners()">
                <option value="">Carregando categorias...</option>
            </select>
        </div>

        <div class="campo">
            <label>2. Escolha o Banner para remover:</label>
            <select id="listaBanners" disabled>
                <option value="">Selecione a categoria primeiro</option>
            </select>
        </div>

        <button class="btn-excluir" id="btnExcluir" onclick="deletar()" disabled>CONFIRMAR EXCLUSÃO</button>
        <div id="msg-status"></div>
        <a href="index.html" class="btn-voltar">Voltar para Início</a>
    </div>

    <script>
        const urlApp = "https://script.google.com/macros/s/AKfycbxTQvfr6fsACUTjL3ay8yfVWy34HWlXpjUJjsZVzbvRF3F8OgXIJB35tcfwowMObvulVA/exec";
        let todosBanners = [];

        async function carregarDados() {
            try {
                const res = await fetch(urlApp);
                todosBanners = await res.json();
                
                const categoriasUnicas = [...new Set(todosBanners.map(b => b.categoria))];
                const selectCat = document.getElementById('categoria');
                
                selectCat.innerHTML = '<option value="">Selecione...</option>';
                categoriasUnicas.sort().forEach(cat => {
                    selectCat.innerHTML += `<option value="${cat}">${cat.toUpperCase()}</option>`;
                });
            } catch (e) {
                document.getElementById('categoria').innerHTML = '<option>Erro ao carregar</option>';
            }
        }

        function filtrarBanners() {
            const catSelected = document.getElementById('categoria').value;
            const selectBanner = document.getElementById('listaBanners');
            const btn = document.getElementById('btnExcluir');
            
            const filtrados = todosBanners.filter(b => b.categoria === catSelected);
            
            selectBanner.innerHTML = '<option value="">Selecione o banner</option>';
            filtrados.forEach(b => {
                selectBanner.innerHTML += `<option value="${b.nome}">${b.nome}</option>`;
            });
            
            selectBanner.disabled = filtrados.length === 0;
            btn.disabled = true; // Só ativa quando escolher o banner
        }

        // Habilita o botão apenas quando um banner específico for selecionado
        document.getElementById('listaBanners').addEventListener('change', function() {
            document.getElementById('btnExcluir').disabled = !this.value;
        });

        async function deletar() {
            const categoria = document.getElementById('categoria').value;
            const nome = document.getElementById('listaBanners').value;
            const btn = document.getElementById('btnExcluir');
            const status = document.getElementById('msg-status');

            if (!confirm(`CUIDADO: Deseja mesmo apagar o banner "${nome}"?`)) return;

            btn.disabled = true;
            btn.innerText = "EXCLUINDO...";
            status.style.display = "block";
            status.innerText = "Processando exclusão na planilha...";
            status.style.color = "#aaa";

            try {
                // Envia comando de delete para o Google Apps Script
                await fetch(urlApp, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "delete", categoria, nome })
                });

                status.innerText = "Sucesso! O banner foi removido.";
                status.style.color = "#27ae60";
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
            } catch (e) {
                status.innerText = "Erro ao tentar excluir.";
                status.style.color = "#E50914";
                btn.disabled = false;
            }
        }

        carregarBanners = carregarDados();
    </script>
</body>
</html>
